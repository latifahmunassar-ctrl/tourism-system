<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فانسي سنس · المصروفات</title>
<link rel="icon" href="fancy-books-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pri:#0e8a86; --pri-d:#0a6b68; --pri-l:#e6f4f3; --side:#0f3d3c; --side-hi:#1b5452;
  --bg:#f5f6f7; --card:#fff; --tx:#1f2328; --mut:#6b7280; --bd:#e5e7eb; --row:#fafbfb;
  --ok:#16a34a; --ok-l:#e8f7ee; --warn:#d97706; --warn-l:#fdf3e2; --bad:#dc2626; --bad-l:#fdecec; --gray-l:#f1f2f4;
}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri);text-decoration:none}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:260px;background:var(--side);color:#fff;flex-shrink:0;padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:6px 18px 22px;color:#fff;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:14px}
.fs-logo{display:block;width:100%;height:auto}
.print-head{display:none}
.nav a{display:flex;align-items:center;gap:10px;color:#e5f0ef;padding:10px 14px;border-radius:8px;margin-bottom:2px;font-weight:500}
.nav a:hover{background:var(--side-hi)}
.nav a.on{background:var(--side-hi);color:#fff;font-weight:700;box-shadow:inset -3px 0 0 #5fd3cd}
.nav .grp{color:#9fbfbd;font-size:12px;padding:14px 14px 6px}
.nav .sub{padding-right:34px}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:64px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}
.top h1{font-size:19px;margin:0;display:flex;align-items:center;gap:10px}
.top .user{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px}
.top .av{width:32px;height:32px;border-radius:50%;background:var(--pri-l);color:var(--pri);display:grid;place-items:center;font-weight:700}
.burger{display:none;background:none;border:0;font-size:22px;cursor:pointer}
.content{padding:24px 32px 40px;max-width:1280px;width:100%}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--bd);margin-bottom:24px}
.tabs a{padding:12px 16px;color:var(--mut);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--pri);border-color:var(--pri);font-weight:600}
/* controls */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.search{position:relative;width:320px;max-width:100%}
.search input{width:100%;height:40px;border:1px solid var(--bd);border-radius:8px;padding:0 38px 0 12px;background:#fff}
.search::before{content:"⌕";position:absolute;right:12px;top:8px;color:var(--mut);font-size:18px}
.btn{height:40px;border-radius:8px;border:1px solid var(--bd);background:#fff;padding:0 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:#c9cdd2}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-d)}
.btn.out{border-color:var(--pri);color:var(--pri)}
.btn.soft{background:var(--pri-l);border-color:var(--pri-l);color:var(--pri)}
.btn.danger{color:var(--bad)}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn.icon{width:40px;padding:0;justify-content:center}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.split{display:inline-flex}.split .btn:first-child{border-radius:0 8px 8px 0}.split .btn:last-child{border-radius:8px 0 0 8px;border-right:1px solid rgba(255,255,255,.3);width:40px;justify-content:center;padding:0}
.badge-n{background:var(--pri);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;margin-right:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--pri-l);color:var(--pri-d);border-radius:16px;padding:3px 10px;font-size:12px;display:inline-flex;gap:6px;align-items:center}
.chip b{cursor:pointer;font-weight:700}
/* table */
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px}
.tbl-wrap{overflow:auto}
table{width:100%;border-collapse:collapse}
th{background:#f9fafb;text-align:right;font-weight:600;font-size:13px;padding:12px 14px;border-bottom:1px solid var(--bd);white-space:nowrap;cursor:default;user-select:none}
th.s{cursor:pointer}th.s::after{content:" ⇅";color:#b0b5bb;font-size:11px}
th.asc::after{content:" ▲";color:var(--pri)}th.desc::after{content:" ▼";color:var(--pri)}
td{padding:14px;border-bottom:1px solid var(--bd);white-space:nowrap}
tbody tr:nth-child(even) td{background:var(--row)}
tbody tr:hover td{background:#f0f8f7}
td.no a{font-weight:600}
td.num{font-variant-numeric:tabular-nums}
td.act{width:84px;text-align:left}
.ib{background:none;border:0;cursor:pointer;width:30px;height:30px;border-radius:6px;font-size:16px;color:#374151}
.ib:hover{background:var(--gray-l)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:12px;padding:2px 9px;font-size:12px;font-weight:500}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-l);color:var(--ok)}.p-warn{background:var(--warn-l);color:var(--warn)}.p-bad{background:var(--bad-l);color:var(--bad)}.p-gray{background:var(--gray-l);color:#6b7280}.p-pri{background:var(--pri-l);color:var(--pri)}
.foot{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;flex-wrap:wrap;gap:10px;color:var(--mut);font-size:13px}
.pager{display:flex;gap:4px;direction:ltr}
.pager button{min-width:32px;height:32px;border:1px solid var(--bd);background:#fff;border-radius:6px;cursor:pointer}
.pager button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.pager button[disabled]{opacity:.4;cursor:default}
.empty{text-align:center;padding:70px 20px;color:var(--mut)}
.empty .ico{font-size:56px;margin-bottom:8px}
.empty h3{color:var(--tx);margin:6px 0}
/* menu */
.menu{position:fixed;background:#fff;border:1px solid var(--bd);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:6px;z-index:50;min-width:160px}
.menu button{display:flex;gap:8px;width:100%;text-align:right;background:none;border:0;padding:9px 12px;border-radius:6px;cursor:pointer}
.menu button:hover{background:var(--gray-l)}
.menu button.d{color:var(--bad)}
/* drawer & modal */
.ov{position:fixed;inset:0;background:rgba(17,24,39,.4);z-index:40;display:flex}
.drawer{background:#fff;width:440px;max-width:100%;height:100%;display:flex;flex-direction:column;margin-left:auto;margin-right:0}
.ov.left .drawer{margin-left:0;margin-right:auto}
.dh{padding:22px 20px 14px;border-bottom:1px solid var(--bd)}
.dh h3{margin:0 0 4px;font-size:19px}.dh p{margin:0;color:var(--mut)}
.db{padding:16px 20px;overflow:auto;flex:1}
.df{padding:14px 20px;border-top:1px solid var(--bd);display:flex;justify-content:space-between;gap:10px}
.modal{background:#fff;border-radius:12px;width:460px;max-width:calc(100% - 32px);margin:auto;max-height:90vh;display:flex;flex-direction:column}
.ck{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--bd);cursor:pointer}
.ck input{width:17px;height:17px;accent-color:var(--pri)}
/* forms */
.form{max-width:850px;margin:0 auto 90px}
.fcard{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:20px 18px;margin-bottom:16px}
.fcard h2{font-size:18px;margin:0 0 18px}
.fl{position:relative;margin-bottom:18px}
.fl label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px}
.fl label .r{color:var(--bad)}
.in{width:100%;height:46px;border:1px solid var(--bd);border-radius:8px;padding:0 12px;background:#fff}
textarea.in{height:90px;padding:10px 12px;resize:vertical}
.in:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-l)}
.in.err{border-color:var(--bad)}
.errm{color:var(--bad);font-size:12px;margin-top:4px}
.row{display:flex;gap:10px;align-items:flex-start}.row>.grow{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.type{border:1px solid var(--bd);border-radius:10px;padding:14px;cursor:pointer;position:relative}
.type b{display:block;margin-bottom:6px}
.type span{color:var(--mut);font-size:13px;line-height:1.6}
.type.on{border-color:var(--pri);background:#f3fbfa;box-shadow:0 0 0 1px var(--pri)}
.type input{position:absolute;left:14px;top:14px;accent-color:var(--pri);width:18px;height:18px}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden;margin-bottom:14px}
.seg button{border:0;background:#fff;padding:9px 18px;cursor:pointer}
.seg button.on{background:var(--pri);color:#fff}
.tgl{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--bd);border-radius:8px;padding:12px 14px;margin-bottom:18px}
.sw{position:relative;width:44px;height:24px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#d1d5db;border-radius:12px;cursor:pointer;transition:.2s}
.sw span::before{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;right:3px;transition:.2s}
.sw input:checked+span{background:var(--pri)}
.sw input:checked+span::before{transform:translateX(-20px)}
.info{background:var(--pri-l);color:var(--pri-d);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:16px;line-height:1.7}
.newtag{background:var(--pri);color:#fff;font-size:11px;border-radius:8px;padding:1px 7px;margin-right:6px;vertical-align:middle}
.drop{border:2px dashed #cfd5da;border-radius:10px;padding:24px;text-align:center;color:var(--mut);cursor:pointer}
.drop.hov{border-color:var(--pri);background:var(--pri-l)}
.files{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.file{background:var(--gray-l);border-radius:8px;padding:6px 10px;font-size:12px;display:flex;gap:8px;align-items:center}
.ms{min-height:46px;border:1px solid var(--bd);border-radius:8px;padding:6px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;cursor:pointer;background:#fff;position:relative}
.ms .tag{background:var(--gray-l);border-radius:6px;padding:3px 8px;font-size:13px;display:inline-flex;gap:6px}
.ms .tag b{cursor:pointer}
.ms .ph{color:var(--mut)}
.msl{position:absolute;top:100%;right:0;left:0;background:#fff;border:1px solid var(--bd);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.1);z-index:20;margin-top:4px;padding:4px;max-height:240px;overflow:auto}
.msl label{display:flex;gap:8px;padding:8px;border-radius:6px;cursor:pointer;font-size:14px;color:var(--tx);margin:0}
.msl label:hover{background:var(--gray-l)}
.payline{display:grid;grid-template-columns:1fr 160px 40px;gap:8px;margin-bottom:10px}
.savebar{position:fixed;bottom:0;right:260px;left:0;background:#fff;border-top:1px solid var(--bd);padding:12px 32px;display:flex;gap:10px;z-index:6}
.savebar .in-w{max-width:850px;margin:0 auto;width:100%;display:flex;gap:10px}
.taxnote{font-size:12px;color:var(--mut);margin:-10px 0 16px}
/* summary */
.sum-top{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;padding:16px}
.wallet{background:linear-gradient(135deg,#12a19c,#0b7470);color:#fff;border-radius:12px;padding:22px;position:relative;overflow:hidden;min-height:300px;display:flex;flex-direction:column}
.wallet::after{content:"";position:absolute;width:260px;height:260px;border:30px solid rgba(255,255,255,.07);border-radius:40px;transform:rotate(-20deg);left:-60px;bottom:-110px}
.wallet h3{margin:0;font-size:19px}.wallet p{margin:4px 0 0;opacity:.85;font-size:13px}
.wallet .bal{font-size:34px;font-weight:700;margin:26px 0;direction:ltr;text-align:right}
.wallet .acts{margin-top:auto;display:flex;gap:10px;position:relative;z-index:1}
.wallet .acts .btn{background:#fff;color:var(--pri-d);border:0}
.wallet .acts .btn.g{background:rgba(255,255,255,.15);color:#fff}
.txl h3{margin:4px 0 14px;font-size:17px}
.tx{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd)}
.tx small{color:var(--mut);display:block}
.tx .amt{font-weight:600;direction:ltr}
.amt.neg{color:var(--bad)}.amt.pos{color:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:14px 0}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:16px}
.kpi small{color:var(--mut)}.kpi div{font-size:22px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.bars{padding:6px 16px 16px}
.bline{display:grid;grid-template-columns:170px 1fr 110px;gap:10px;align-items:center;margin:9px 0;font-size:13px}
.btrack{background:var(--gray-l);border-radius:4px;height:12px;overflow:hidden}
.bfill{height:100%;background:var(--pri);border-radius:4px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:26px 0 6px}
.sec-h h2{font-size:19px;margin:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g2 .card h4{margin:0;padding:14px 16px 4px}
/* view */
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 20px}
.vgrid small{color:var(--mut);display:block;margin-bottom:3px}
.vgrid div{font-weight:500}
.sync{font-size:12px;padding:3px 9px;border-radius:10px;background:var(--ok-l);color:var(--ok)}
.sync[data-s=saving]{background:var(--warn-l);color:var(--warn)}.sync[data-s=err]{background:var(--bad-l);color:var(--bad)}.sync[data-s=off]{background:var(--gray-l);color:var(--mut)}
.side-user{position:sticky;top:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;margin-top:20px;border-top:1px solid rgba(255,255,255,.1);font-size:13px;color:#cfe3e1}
.side-user button{background:rgba(255,255,255,.1);color:#fff;border:0;border-radius:6px;padding:5px 10px;cursor:pointer}
.login{position:fixed;inset:0;background:linear-gradient(160deg,#0f3d3c,#0e8a86);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.login .box{background:#fff;border-radius:16px;padding:28px 26px;width:380px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.login .lg{width:190px;margin:0 auto 18px;color:#222}
.login .seg{display:flex;margin-bottom:18px}.login .seg button{flex:1}
.login .msg{color:var(--bad);font-size:13px;min-height:18px;margin-bottom:8px}
.loading{text-align:center;padding:80px;color:var(--mut)}
.thumb{width:44px;height:44px;border-radius:6px;background:var(--gray-l);object-fit:cover;display:inline-grid;place-items:center;color:#b6bcc3;font-size:20px;vertical-align:middle;flex-shrink:0}
.pname{display:flex;align-items:center;gap:10px}
td.ck,th.ck{width:36px;text-align:center}td.ck input,th.ck input{accent-color:var(--pri);width:16px;height:16px}
.qneg{color:var(--bad);font-weight:600}.qlow{color:var(--warn);font-weight:600}
.loc-card{border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.loc-card h4{margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 12px}
.imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.imgs .im{position:relative}.imgs img{width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--bd)}
.imgs .im b{position:absolute;top:-6px;left:-6px;background:#111;color:#fff;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:11px;cursor:pointer}
.bulkbar{display:flex;gap:8px;align-items:center;background:var(--pri-l);border-radius:8px;padding:8px 12px;margin-bottom:10px;color:var(--pri-d);font-weight:500}
@media (max-width:900px){.grid4{grid-template-columns:1fr 1fr}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:8px;z-index:99;font-size:14px}
@media (max-width:900px){
  .side{position:fixed;right:-280px;z-index:60;transition:.2s}.side.open{right:0}
  .burger{display:block}
  .content{padding:16px}
  .top{padding:0 16px}
  .savebar{right:0;padding:10px 16px}
  .sum-top,.g2{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .types,.grid2,.vgrid{grid-template-columns:1fr}
  .bline{grid-template-columns:100px 1fr 80px}
  .top .user span{display:none}
}
@media print{
  .side,.top,.tabs,.savebar,.no-print{display:none!important}
  .print-head{display:block!important;width:180px;margin:0 auto 18px;color:#222}
  .content{padding:0}.card,.fcard{border:0}
  body{background:#fff}
}
</style>
</head>

<script>
/* ===================== storage ===================== */
const KEY='exp_app_v1';
const DEF_CATS=[
 ['الرواتب والرسوم الإدارية','Operating Expenses'],['التأمين الطبي والعلاج','Operating Expenses'],['العمولات والحوافز','Operating Expenses'],
 ['التسويق والإعلان','Operating Expenses'],['مصروفات الإيجار','Operating Expenses'],['الرسوم الحكومية','Operating Expenses'],
 ['مصروفات التأمينات الاجتماعية','Operating Expenses'],['مصروفات السفر','Operating Expenses'],['الرسوم والاشتراكات','Operating Expenses'],
 ['القرطاسية والمطبوعات','Operating Expenses'],['الضيافة والنظافة','Operating Expenses'],['نفقات المرافق','Operating Expenses'],
 ['الإهلاك','Operating Expenses'],['نفقات أخرى','Operating Expenses'],['عمولات بنكية','Other Expenses'],['مصاريف اعلانات كوبون','Other Expenses'],
 ['مصاريف شحن','Other Expenses'],['ايجار','Other Expenses'],['زكاة','Other Expenses'],['الشحن والرسوم الجمركية','Other Expenses'],['عمولة المبيعات','Other Expenses']];
const DEF_METHODS=['Cash','Credit Card','تحويل بنكي','مجاني','تحويل بنكي روافي','دفع بالأجل ( موقع اونلاين )'];
const DEF_BRANCHES=['Oman','Shop-SalalahGardens mall','Kiosk-SalalahGardens mall'];
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
function fresh(){
  return {seq:0,rseq:0,expenses:[],recurring:[],
    categories:DEF_CATS.map(([n,g])=>({id:uid(),name:n,group:g})),
    methods:DEF_METHODS.map(n=>({id:uid(),name:n})),
    branches:DEF_BRANCHES.map(n=>({id:uid(),name:n})),
    suppliers:[],prepaidAccounts:[{id:uid(),name:'مصروفات مدفوعة مقدماً'}],
    wallet:[],settings:{currency:'ر.ع',decimals:3,vat:5},
    products:[],pcats:[],brands:[],taxes:[{id:'tx1',name:'ضريبه عمان',rate:5},{id:'tx0',name:'معفى',rate:0}],
    cols:{name:1,type:1,cat:1,branch:1,method:0,amount:1,status:1,remaining:1,supplier:0,tax:0,date:0,taxable:0,freq:0,draft:0},
    pcols:{base:1,cat:1,sku:1,barcode:1,qty:1,cost:1,retail:1,wholesale:1,tax:1,brand:0,desc:0,buy:0,supplier:0,ptype:0}};
}
/* ---------- shared data (Supabase via fs-books) ---------- */
const FN='https://ofotvacszlmrqxzfjmtn.supabase.co/functions/v1/fs-books';
const FN_LOGIN='https://ofotvacszlmrqxzfjmtn.supabase.co/functions/v1/acc-dashboard';
const LOCAL=new URLSearchParams(location.search).has('local'); // وضع تجربة محلي بدون خادم
const ARR=['expenses','recurring','products'], LOCAL_ONLY=['cols','pcols'];
let S=fresh(), SNAP={}, LAST='', ME='';
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
function prefsLoad(){try{const p=JSON.parse(ls.get('fsb_prefs')||'{}');if(p.cols)Object.assign(S.cols,p.cols);if(p.pcols)Object.assign(S.pcols,p.pcols)}catch(e){}}
function authHeaders(){const h={};const t=ls.get('acc_token'),k=ls.get('acc_key');if(t)h['x-acc-token']=t;else if(k)h['x-acc-key']=k;return h}
async function api(method,body,qs=''){
  const r=await fetch(FN+qs,{method,cache:'no-store',headers:{...authHeaders(),...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});
  if(r.status===401){const e=new Error('unauthorized');e.code=401;throw e}
  const j=await r.json();if(!r.ok||j.error)throw new Error(j.error||('HTTP '+r.status));return j;
}
function docsOf(){
  const out={};for(const c of ARR)for(const x of S[c])out[c+':'+x.id]={coll:c,id:x.id,data:x};
  const meta={};for(const k in S)if(!ARR.includes(k)&&!LOCAL_ONLY.includes(k))meta[k]=S[k];
  out['meta:main']={coll:'meta',id:'main',data:meta};return out;
}
function applyDocs(docs,full){
  if(full){S=fresh();prefsLoad();SNAP={}}
  let changed=0;
  for(const d of docs){
    const k=d.coll+':'+d.id;
    if(d.coll==='meta'){if(!d.deleted){const keep={cols:S.cols,pcols:S.pcols};Object.assign(S,d.data,keep);SNAP[k]=JSON.stringify(docsOf()['meta:main'].data);changed++}continue}
    if(!ARR.includes(d.coll))continue;
    const arr=S[d.coll],i=arr.findIndex(x=>x.id===d.id);
    if(d.deleted){if(i>=0){arr.splice(i,1);changed++}delete SNAP[k];continue}
    if(SNAP[k]===JSON.stringify(d.data))continue;
    if(i>=0)arr[i]=d.data;else arr.push(d.data);
    SNAP[k]=JSON.stringify(d.data);changed++;
  }
  return changed;
}
function setSync(st){const el=$('#sync');if(!el)return;el.dataset.s=st;el.textContent={ok:'✓ محفوظ',saving:'⟳ جاري الحفظ…',err:'⚠ لم يُحفظ',off:'وضع محلي'}[st]||''}
function save(){
  ls.set('fsb_prefs',JSON.stringify({cols:S.cols,pcols:S.pcols}));
  if(LOCAL){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('تعذّر الحفظ محلياً')}return}
  clearTimeout(save.t);setSync('saving');save.t=setTimeout(flush,250);
}
let flushing=false;
async function flush(){
  if(flushing){clearTimeout(save.t);save.t=setTimeout(flush,400);return}
  flushing=true;
  try{
    const cur=docsOf(),put=[],del=[];
    for(const k in cur){const j=JSON.stringify(cur[k].data);if(SNAP[k]!==j)put.push([k,cur[k],j])}
    for(const k in SNAP)if(!(k in cur)&&!k.startsWith('meta:')){const i=k.indexOf(':');del.push([k,{coll:k.slice(0,i),id:k.slice(i+1)}])}
    for(let i=0;i<put.length;i+=200){const ch=put.slice(i,i+200);await api('POST',{action:'put',docs:ch.map(x=>x[1])});ch.forEach(([k,,j])=>SNAP[k]=j)}
    for(let i=0;i<del.length;i+=200){const ch=del.slice(i,i+200);await api('POST',{action:'del',items:ch.map(x=>x[1])});ch.forEach(([k])=>delete SNAP[k])}
    setSync('ok');
  }catch(e){
    setSync('err');if(e.code===401){showLogin('انتهت الجلسة، سجّلي الدخول مرة ثانية');}else{toast('تعذّر الحفظ، ستتم إعادة المحاولة');clearTimeout(save.t);save.t=setTimeout(flush,6000)}
  }finally{flushing=false}
}
async function loadAll(){
  if(LOCAL){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.expenses)S=Object.assign(fresh(),d)}catch(e){}prefsLoad();setSync('off');ME='تجربة محلية';return}
  const j=await api('GET');ME=j.user;LAST=j.now;applyDocs(j.docs,true);
  if(!SNAP['meta:main'])save(); // أول تشغيل: ارفع الإعدادات الافتراضية
  setSync('ok');
}
async function poll(){
  if(LOCAL||document.hidden||flushing||!LAST)return;
  try{const j=await api('GET',null,'?since='+encodeURIComponent(LAST));LAST=j.now;
    const n=applyDocs(j.docs,false);
    if(n&&!/^#\/(new|edit|pnew|pedit)/.test(location.hash)&&!document.querySelector('.ov'))route(true);
  }catch(e){if(e.code===401)showLogin('انتهت الجلسة')}
}
setInterval(poll,40000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
const nextNo=()=>S.expenses.reduce((m,e)=>Math.max(m,e.no||0),0)+1;

/* ===================== helpers ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=(arr,id)=>arr.find(x=>x.id===id);
const fmt=n=>(+n||0).toLocaleString('en-US',{minimumFractionDigits:S.settings.decimals,maximumFractionDigits:S.settings.decimals});
const money=n=>fmt(n)+' '+S.settings.currency;
const isoL=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
const today=()=>isoL(new Date());
const dmy=d=>d?d.split('-').reverse().join('-'):'';
const r3=n=>Math.round((+n||0)*1000)/1000;
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}
const TYPE_L={single:'فردي',recurring:'متكرر',prepaid:'مقدم'};
const FREQ_L={daily:'يومي',weekly:'أسبوعي',monthly:'شهري'};
function paidOf(e){return r3((e.payments||[]).reduce((a,p)=>a+(+p.amount||0),0))}
function remainingOf(e){return e.payType==='later'?r3(e.amount-paidOf(e)):0}
function statusOf(e){
  if(e.draft)return['مسودة','p-gray'];
  if(e.payType==='paid')return['مدفوع','p-ok'];
  const p=paidOf(e);if(p<=0)return['غير مدفوع','p-bad'];if(p<e.amount)return['مدفوع جزئياً','p-warn'];return['مدفوع','p-ok'];
}
function taxOf(e){return e.taxable?r3(e.amount-e.amount/(1+(e.vatRate??S.settings.vat)/100)):0}
function catName(id){return byId(S.categories,id)?.name||'—'}
function brNames(ids){return (ids||[]).map(i=>byId(S.branches,i)?.name).filter(Boolean).join('، ')||'—'}
function methodNames(e){return [...new Set((e.payments||[]).map(p=>byId(S.methods,p.methodId)?.name).filter(Boolean))].join('، ')||'—'}

/* ===================== recurring engine ===================== */
function addPeriod(d,f){const x=new Date(d+'T12:00:00');if(f==='daily')x.setDate(x.getDate()+1);else if(f==='weekly')x.setDate(x.getDate()+7);else x.setMonth(x.getMonth()+1);return isoL(x)}
function runRecurring(){
  const t=today();let n=0;
  for(const r of S.recurring){
    if(r.stopped)continue;
    let next=r.nextDate||r.start;
    let guard=0;
    while(next<=t&&(!r.end||next<=r.end)&&guard++<400){
      makeExpense({...r.tpl,id:r.id+'_'+next,date:next,type:'recurring',recurringId:r.id});
      next=addPeriod(next,r.freq);n++;
    }
    r.nextDate=next;
    if(r.end&&next>r.end&&!r.stopped){r.finished=true}
  }
  if(n){save();setTimeout(()=>toast(`تم إنشاء ${n} مصروف متكرر تلقائياً`),300)}
}
function makeExpense(d){

  const e={no:nextNo(),createdAt:new Date().toISOString(),createdBy:ME,...c,id:c.id||uid()};

function filtered(){

  return S.expenses.filter(e=>{
    if(f.from&&e.date<f.from)return false;if(f.to&&e.date>f.to)return false;
    if(f.cat&&e.categoryId!==f.cat)return false;
    if(f.branch&&!(e.branches||[]).includes(f.branch))return false;
    if(f.type&&e.type!==f.type)return false;
    if(f.method&&!(e.payments||[]).some(p=>p.methodId===f.method))return false;
    if(f.status&&statusOf(e)[0]!==f.status)return false;

/* CSV export / import */
function exportCSV(){
  const list=sorted(filtered());
  const head=['رقم المصروف','اسم المصروف','نوع المصروف','فئة المصروف','الموقع','وسيلة الدفع','المبلغ','قيمة الضريبة','حالة الدفع','المبلغ المتبقي','المورد','التاريخ','الرقم المرجعي','ملاحظات'];
  const rows=list.map(e=>['Exp-'+e.no,e.name,TYPE_L[e.type],catName(e.categoryId),brNames(e.branches),methodNames(e),e.amount,taxOf(e),statusOf(e)[0],remainingOf(e),byId(S.suppliers,e.supplierId)?.name||'',e.date,e.ref||'',e.notes||'']);
  const csv='﻿'+[head,...rows].map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`expenses-${today()}.csv`;a.click();
}
function importCSV(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.csv';
  inp.onchange=async()=>{
    const txt=(await inp.files[0].text()).replace(/^﻿/,'');
    const rows=parseCSV(txt);const h=rows.shift().map(s=>s.trim());
    const ix=n=>h.indexOf(n);let n=0;
    const findOrAdd=(arr,name,extra={})=>{if(!name)return null;let x=arr.find(a=>a.name===name);if(!x){x={id:uid(),name,...extra};arr.push(x)}return x.id};
    for(const r of rows){
      if(!r.join('').trim())continue;
      const amt=+String(r[ix('المبلغ')]||0).replace(/,/g,'');
      const mid=findOrAdd(S.methods,(r[ix('وسيلة الدفع')]||'').split('،')[0].trim()||'Cash');
      makeExpense({name:r[ix('اسم المصروف')]||'مصروف',type:'single',categoryId:findOrAdd(S.categories,r[ix('فئة المصروف')]||'نفقات أخرى',{group:'Operating Expenses'}),
        branches:(r[ix('الموقع')]||'').split('،').map(s=>s.trim()).filter(Boolean).map(b=>findOrAdd(S.branches,b)),
        date:normDate(r[ix('التاريخ')])||today(),payType:'paid',payments:[{methodId:mid,amount:amt}],amount:amt,taxable:false,ref:r[ix('الرقم المرجعي')]||'',notes:r[ix('ملاحظات')]||'',attachments:[]});n++;
    }
    save();toast(`تم استيراد ${n} مصروف`);viewList();
  };inp.click();
}
function normDate(s){if(!s)return'';s=s.trim();if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);const m=s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})/);return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:''}
function parseCSV(t){const out=[];let row=[],cur='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}else if(c==='"')q=true;else if(c===','){row.push(cur);cur=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);out.push(row);row=[];cur=''}else cur+=c}if(cur||row.length){row.push(cur);out.push(row)}return out}

let F=null;
function blankForm(){return{name:'',categoryId:'',branches:S.branches[0]?[S.branches[0].id]:[],date:today(),type:'single',
  freq:'monthly',hasEnd:false,end:'',prepaid:{start:today().slice(0,7),months:'',accountId:''},
  payType:'paid',supplierId:'',multi:false,payments:[{methodId:'',amount:''}],amount:'',taxable:false,vatRate:S.settings.vat,ref:'',notes:'',attachments:[],paidNow:''}}
function viewForm(id){
  const e=id?byId(S.expenses,id):null;
  if(id&&!e){location.hash='#/expenses';return}
  F=e?{...blankForm(),...structuredClone(e),multi:(e.payments||[]).length>1}:blankForm();
  if(e&&e.payType==='later'){F.paidNow=paidOf(e)||''}

function msInner(){
  return (F.branches.length?F.branches.map(id=>`<span class="tag">${esc(byId(S.branches,id)?.name)} <b data-rm="${id}">✕</b></span>`).join(''):'<span class="ph">اختر الفروع</span>')+`<span style="margin-right:auto;color:var(--mut)">⌄</span>`;
}
function bindForm(){
  document.querySelectorAll('[data-f]').forEach(el=>{
    el.addEventListener('input',()=>{F[el.dataset.f]=el.value;
      if(el.dataset.f==='amount'&&F.payments.length===1&&!F.multi)F.payments[0].amount=el.value;
      if(['amount','vatRate'].includes(el.dataset.f)&&F.taxable&&$('#taxv'))$('#taxv').value=fmt(+F.amount?F.amount-F.amount/(1+F.vatRate/100):0);
    });
    if(el.tagName==='SELECT')el.addEventListener('change',()=>{F[el.dataset.f]=el.value;if(el.dataset.f==='payType'){F.multi=false;F.payments=[{methodId:F.payments[0]?.methodId||'',amount:''}];renderForm()}});
  });
  document.querySelectorAll('[data-p]').forEach(el=>{const h=()=>{F.payments[+el.dataset.p][el.dataset.k]=el.value;if(F.multi&&el.dataset.k==='amount'){syncAmt();$('[data-f=amount]').value=F.amount}};el.addEventListener('input',h);el.addEventListener('change',h)});
  document.querySelectorAll('[data-pp]').forEach(el=>{el.addEventListener('change',()=>{F.prepaid[el.dataset.pp]=el.value;if(el.dataset.pp==='months')renderForm()})});
  const ms=$('#msb');
  ms.onclick=ev=>{
    if(ev.target.dataset.rm){F.branches=F.branches.filter(x=>x!==ev.target.dataset.rm);ms.innerHTML=msInner();return}
    if(ev.target.closest('.msl'))return;
    const l=document.createElement('div');l.className='msl';
    l.innerHTML=S.branches.map(b=>`<label><input type="checkbox" value="${b.id}" ${F.branches.includes(b.id)?'checked':''}> ${esc(b.name)}</label>`).join('')+`<button class="btn sm" style="width:100%;margin-top:4px" data-nb>＋ فرع جديد</button>`;
    ms.appendChild(l);
    l.onchange=x=>{const v=x.target.value;F.branches=x.target.checked?[...F.branches,v]:F.branches.filter(y=>y!==v);ms.querySelectorAll('.tag,.ph').forEach(n=>n.remove());ms.insertAdjacentHTML('afterbegin',msInner().replace(/<span style="margin-right:auto[^]*$/,''))};
    l.querySelector('[data-nb]').onclick=x=>{x.stopPropagation();promptDlg('فرع جديد','اسم الفرع',n=>{const b={id:uid(),name:n};S.branches.push(b);F.branches.push(b.id);save();renderForm()})};
    setTimeout(()=>document.addEventListener('click',function c(x){if(!ms.contains(x.target)){l.remove();document.removeEventListener('click',c)}}),0);
  };
  const drop=$('#drop'),pick=()=>{const i=document.createElement('input');i.type='file';i.multiple=true;i.accept='.pdf,.png,.jpg,.jpeg,.bmp';i.onchange=()=>addFiles(i.files);i.click()};
  drop.onclick=pick;drop.ondragover=e=>{e.preventDefault();drop.classList.add('hov')};drop.ondragleave=()=>drop.classList.remove('hov');
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove('hov');addFiles(e.dataTransfer.files)};
}
function addFiles(list){
  const arr=[...list].slice(0,10-F.attachments.length);let pending=arr.length;
  arr.forEach(f=>{if(f.size>2*1024*1024){toast(`${f.name}: الحد الأقصى 2MB للملف`);if(!--pending)renderForm();return}
    const r=new FileReader();r.onload=()=>{F.attachments.push({name:f.name,type:f.type,data:r.result});if(!--pending)renderForm()};r.readAsDataURL(f)});
}
function syncAmt(){if(F.multi&&F.payType==='paid')F.amount=String(r3(F.payments.reduce((a,p)=>a+(+p.amount||0),0)))}
function toggleMulti(on){F.multi=on;if(on){F.payments=[{methodId:F.payments[0]?.methodId||'',amount:F.amount},{methodId:'',amount:''}]}else{F.payments=[{methodId:F.payments[0]?.methodId||'',amount:F.amount}]}syncAmt();renderForm()}
function newCategory(){promptDlg('فئة جديدة','اسم الفئة',(n,o)=>{const c={id:uid(),name:n,group:o.querySelector('[data-g]').value};S.categories.push(c);F.categoryId=c.id;save();renderForm()},
  `<div class="fl"><label>المجموعة</label><select class="in" data-g><option>Operating Expenses</option><option>Other Expenses</option></select></div>`)}
function newSupplier(){promptDlg('مورّد جديد','اسم المورّد',n=>{const s={id:uid(),name:n};S.suppliers.push(s);F.supplierId=s.id;save();renderForm()})}
function newPrepaidAcc(){promptDlg('حساب جديد','اسم الحساب',n=>{const a={id:uid(),name:n};S.prepaidAccounts.push(a);F.prepaid.accountId=a.id;save();renderForm()})}
function submitForm(draft){
  const e=F,er={};
  if(!e.name.trim())er.name=1;
  if(!e.categoryId)er.categoryId=1;
  if(!e.branches.length)er.branches=1;
  if(!(+e.amount>0))er.amount='أدخل مبلغاً أكبر من صفر';
  if(e.payType==='paid'||e.type==='recurring'){
    if(e.multi){if(e.payments.some(p=>!p.methodId||!(+p.amount>0)))er.method=1}
    else if(!e.payments[0]?.methodId)er.method=1;
  }
  if(e.payType==='later'&&+e.paidNow>+e.amount)er.amount='المبلغ المدفوع أكبر من المبلغ الإجمالي';
  if(e.type==='recurring'&&e.hasEnd&&(!e.end||e.end<e.date))er.end=1;
  if(e.type==='prepaid'){if(!(+e.prepaid.months>0))er.months=1;if(!e.prepaid.accountId)er.acc=1}
  if(draft){delete er.method;delete er.months;delete er.acc;delete er.end;if(!er.amount&&!(+e.amount>=0))er.amount='أدخل المبلغ'}
  if(draft&&er.amount&&+e.amount===0)delete er.amount;
  F._err=er;
  if(Object.keys(er).length){renderForm();toast('يرجى إكمال الحقول المطلوبة');document.querySelector('.err')?.scrollIntoView({block:'center',behavior:'smooth'});return}
  const amt=r3(e.amount);
  let payments;
  if(e.payType==='later'&&e.type!=='recurring'){payments=+e.paidNow>0?[{methodId:e.payments[0]?.methodId||S.methods[0].id,amount:r3(e.paidNow),date:e.date}]:[]}
  else payments=e.multi?e.payments.map(p=>({methodId:p.methodId,amount:r3(p.amount)})):[{methodId:e.payments[0].methodId,amount:amt}];
  const data={name:e.name.trim(),categoryId:e.categoryId,branches:e.branches,date:e.date,type:e.type,payType:e.type==='recurring'?'paid':e.payType,supplierId:e.supplierId,
    payments,amount:amt,taxable:e.taxable,vatRate:+e.vatRate,ref:e.ref,notes:e.notes,attachments:e.attachments,draft:!!draft,
    prepaid:e.type==='prepaid'?{start:e.prepaid.start,months:+e.prepaid.months,accountId:e.prepaid.accountId}:null};
  if(F._id){
    const old=byId(S.expenses,F._id);Object.assign(old,data,{type:old.type,recurringId:old.recurringId});save();toast('تم حفظ التعديلات');location.hash='#/view/'+old.id;return;
  }
  if(e.type==='recurring'){
    const r={id:uid(),no:S.recurring.reduce((m,x)=>Math.max(m,x.no||0),0)+1,tpl:{...data,type:'recurring'},freq:e.freq,start:e.date,end:e.hasEnd?e.end:null,nextDate:e.date,stopped:false,createdAt:new Date().toISOString()};
    S.recurring.push(r);runRecurring();save();toast('تم إنشاء المصروف المتكرر');location.hash='#/recurring';return;
  }
  const n=makeExpense(data);save();toast(draft?`تم حفظ Exp-${n.no} كمسودة`:`تم إنشاء Exp-${n.no}`);location.hash='#/expenses';
}

function compressImg(file,max=700){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

/* ---- import / export ---- */
function importRewaa(d){
  const brMap={};
  for(const l of d.locations||[]){const n=normS(l.name);let b=S.branches.find(x=>normS(x.name).toLowerCase()===n.toLowerCase());if(!b){b={id:uid(),name:n};S.branches.push(b)}brMap[n.toLowerCase()]=b.id}
  const supMap={};for(const s of d.suppliers||[]){const n=normS(s.name);let x=S.suppliers.find(y=>normS(y.name)===n);if(!x){x={id:uid(),name:n,phone:s.phone||''};S.suppliers.push(x)}supMap[s.id]=x.id}
  const fa=(arr,name)=>{name=normS(name);if(!name)return'';let x=arr.find(a=>normS(a.name)===name);if(!x){x={id:uid(),name};arr.push(x)}return x.id};
  let n=0,u=0;
  for(const v of d.products||[]){
    const id='rw'+v.id,ex=byId(S.products,id),locs={};
    for(const [ln,q] of Object.entries(v.qty||{})){const bid=brMap[normS(ln).toLowerCase()];if(!bid)continue;const pr=(v.prices||{})[ln]||{};locs[bid]={qty:+q||0,retail:pr.retail??v.retail,wholesale:pr.wholesale??v.wholesale,buy:pr.buy??v.buyPrice,tax:ex?.locs?.[bid]?.tax||S.taxes[0]?.id}}
    const p={...(ex||{}),id,rid:v.id,name:normS(v.name)||v.sku,baseName:normS(v.productName),type:v.productType==='composite'?'composite':'simple',sku:v.sku||'',barcode:v.barcode||'',desc:v.desc||'',sellable:v.isSellable!==false,purchasable:v.isPurchasable!==false,track:true,weighted:!!v.isWeighted,cost:+v.cost||0,minQty:v.threshold??'',catId:fa(S.pcats,v.category),brandId:fa(S.brands,v.brand),supplierId:supMap[v.supplierId]||'',locs,images:ex?.images||[],components:ex?.components||[],createdAt:v.createdAt||new Date().toISOString(),log:ex?.log||[]};
    if(ex){Object.assign(ex,p);u++}else{S.products.push(p);n++}
  }
  save();return[n,u];
}
function importRewaaFile(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{const d=JSON.parse(await i.files[0].text());if(!d.products)throw 0;const[n,u]=importRewaa(d);toast(`تم استيراد ${n} منتج جديد وتحديث ${u}`);viewProducts()}catch(e){toast('ملف غير صالح')}};i.click()}
function exportPCSV(){
  const list=pfiltered().sort(PSORT[PS.sort][1]);
  const head=['اسم المنتج','المنتج الأساسي','الرمز التعريفي','الباركود','فئة','العلامة التجارية','المورد','فئة المنتج','التكلفة',...S.branches.flatMap(b=>[`كمية ${b.name}`,`سعر التجزئة ${b.name}`,`سعر الجملة ${b.name}`]),'الوصف'];
  const rows=list.map(p=>[p.name,p.baseName||'',p.sku,p.barcode,pcat(p.catId),brandN(p.brandId),supN(p.supplierId),PT_L[p.type],p.cost,...S.branches.flatMap(b=>{const L=p.locs?.[b.id]||{};return[L.qty??0,L.retail??'',L.wholesale??'']}),p.desc||'']);
  const csv='﻿'+[head,...rows].map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`products-${today()}.csv`;a.click();
}
function importPCSV(){
  const i=document.createElement('input');i.type='file';i.accept='.csv';
  i.onchange=async()=>{const rows=parseCSV((await i.files[0].text()).replace(/^﻿/,''));const h=rows.shift().map(x=>x.trim());const ix=n=>h.indexOf(n);let n=0,u=0;
    const fa=(arr,name)=>{name=normS(name);if(!name)return'';let x=arr.find(a=>normS(a.name)===name);if(!x){x={id:uid(),name};arr.push(x)}return x.id};
    for(const r of rows){const g=k=>ix(k)>=0?r[ix(k)]:undefined;const name=normS(g('اسم المنتج'));if(!name)continue;const sku=normS(g('الرمز التعريفي'))||genSku();
      let p=S.products.find(x=>x.sku===sku);const isNew=!p;if(isNew){p={...blankP(),id:uid(),createdAt:new Date().toISOString(),log:[],locs:{}};delete p.attr;delete p.values;S.products.push(p);n++}else u++;
      Object.assign(p,{name,sku,baseName:normS(g('المنتج الأساسي'))||name,barcode:normS(g('الباركود'))||p.barcode||''});
      if(g('فئة')!==undefined)p.catId=fa(S.pcats,g('فئة'));if(g('العلامة التجارية')!==undefined)p.brandId=fa(S.brands,g('العلامة التجارية'));if(g('المورد')!==undefined)p.supplierId=fa(S.suppliers,g('المورد'));
      if(g('التكلفة')!==undefined)p.cost=+g('التكلفة')||0;if(g('الوصف')!==undefined)p.desc=g('الوصف');
      S.branches.forEach(b=>{p.locs[b.id]=p.locs[b.id]||{qty:0,retail:'',wholesale:'',buy:'',tax:S.taxes[0]?.id};const L=p.locs[b.id];const q=g(`كمية ${b.name}`),rt=g(`سعر التجزئة ${b.name}`),ws=g(`سعر الجملة ${b.name}`);if(q!==undefined&&q!==''){if(+q!==+L.qty)p.log.push({date:new Date().toISOString(),user:ME,branch:b.id,from:+L.qty||0,to:+q,reason:'استيراد CSV'});L.qty=+q}if(rt!==undefined&&rt!=='')L.retail=+rt;if(ws!==undefined&&ws!=='')L.wholesale=+ws});
    }
    save();toast(`تم: ${n} جديد، ${u} محدّث`);viewProducts()};i.click();
}

  const list=(key,title)=>`<div class="fcard"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h2 style="margin:0">${title}</h2><button class="btn sm out" onclick="addItem('${key}')">＋ إضافة</button></div>
   ${S[key].map(x=>`<div class="tx"><span>${esc(x.name)}${x.group?` <small style="display:inline;color:var(--mut)">· ${esc(x.group)}</small>`:''}</span><span><button class="ib" title="تعديل" onclick="renItem('${key}','${x.id}')">✏️</button><button class="ib" title="حذف" onclick="delItem('${key}','${x.id}')">🗑</button></span></div>`).join('')||'<p style="color:var(--mut)">لا يوجد</p>'}</div>`;
  $('#view').innerHTML=`<div class="form" style="margin-bottom:30px">
   <div class="fcard"><h2>عام</h2><div class="grid2"><div class="fl"><label>رمز العملة</label><input class="in" value="${esc(S.settings.currency)}" onchange="S.settings.currency=this.value;save()"></div>
   <div class="fl"><label>عدد المنازل العشرية</label><select class="in" onchange="S.settings.decimals=+this.value;save()">${[0,2,3].map(n=>`<option ${n===S.settings.decimals?'selected':''}>${n}</option>`).join('')}</select></div>
   <div class="fl"><label>نسبة الضريبة الافتراضية %</label><input class="in" type="number" value="${S.settings.vat}" onchange="S.settings.vat=+this.value;save()"></div></div></div>
   ${list('categories','فئات المصروفات')}${list('branches','الفروع')}${list('methods','وسائل الدفع')}${list('suppliers','الموردون')}${list('prepaidAccounts','حسابات المصروفات المدفوعة مسبقاً')}
   <div class="fcard"><h2>النسخ الاحتياطي</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="backup()">⬇ تنزيل نسخة احتياطية (JSON)</button><button class="btn" onclick="restore()">⬆ استعادة نسخة</button>${ME==='المالكة'||LOCAL?'':'<!--'}<button class="btn danger" onclick="confirmDlg('مسح كل البيانات؟','سيتم حذف جميع المصروفات والإعدادات من هذا المتصفح نهائياً. نزّل نسخة احتياطية أولاً.',()=>{S=fresh();save();toast('تم المسح');route()})">مسح كل البيانات</button>${ME==='المالكة'||LOCAL?'':'-->'}</div>
   <p style="color:var(--mut);font-size:13px;margin-bottom:0">البيانات محفوظة في قاعدة البيانات المشتركة ويراها كل من لديه صلاحية.</p></div></div>`;
}
const used=(key,id)=>({categories:e=>e.categoryId===id,branches:e=>(e.branches||[]).includes(id),methods:e=>(e.payments||[]).some(p=>p.methodId===id),suppliers:e=>e.supplierId===id,prepaidAccounts:e=>e.prepaid?.accountId===id})[key];
function addItem(key){promptDlg('إضافة','الاسم',n=>{S[key].push({id:uid(),name:n,...(key==='categories'?{group:'Operating Expenses'}:{})});save();viewSettings()})}
function renItem(key,id){const x=byId(S[key],id);promptDlg('تعديل','الاسم',n=>{x.name=n;save();viewSettings()});setTimeout(()=>{const i=document.querySelector('[data-v]');i.value=x.name;i.select()},0)}
function delItem(key,id){if(S.expenses.some(used(key,id))){toast('لا يمكن الحذف: مستخدم في مصروفات');return}confirmDlg('حذف العنصر؟','',()=>{S[key]=S[key].filter(x=>x.id!==id);save();viewSettings()})}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download=`expenses-backup-${today()}.json`;a.click()}
function restore(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{const d=JSON.parse(await i.files[0].text());if(!d.expenses)throw 0;S=d;save();toast('تمت الاستعادة');route()}catch(e){toast('ملف غير صالح')}};i.click()}

/* ===================== boot ===================== */
document.querySelector('.print-head').innerHTML=document.querySelector('.brand').innerHTML;
function showLogin(msg=''){
  BOOTED=false;document.querySelector('.login')?.remove();
  const o=document.createElement('div');o.className='login';
  o.innerHTML=`<div class="box"><div class="lg">${document.querySelector('.brand').innerHTML}</div>
   <div class="seg"><button class="on" data-m="staff">موظف</button><button data-m="owner">المالكة</button></div>
   <div data-p="staff"><div class="fl"><label>الاسم</label><input class="in" id="lgn" autocomplete="username"></div><div class="fl"><label>الرمز (PIN)</label><input class="in" id="lgp" type="password" inputmode="numeric" autocomplete="current-password"></div></div>
   <div data-p="owner" style="display:none"><div class="fl"><label>كلمة مرور النظام</label><input class="in" id="lgk" type="password" autocomplete="current-password"></div></div>
   <div class="msg" id="lgm">${esc(msg)}</div>
   <button class="btn pri" style="width:100%;justify-content:center;height:46px" id="lgb">دخول</button>
   <p style="color:var(--mut);font-size:12px;text-align:center;margin:14px 0 0">نفس حساب نظام العز. يحتاج الموظف صلاحية «فانسي سنس».</p></div>`;
  document.body.appendChild(o);
  let mode='staff';
  o.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;o.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===b));o.querySelectorAll('[data-p]').forEach(x=>x.style.display=x.dataset.p===mode?'':'none')});
  const m=o.querySelector('#lgm'),btn=o.querySelector('#lgb');
  const go=async()=>{
    m.textContent='';btn.disabled=true;btn.textContent='جاري الدخول…';
    try{
      if(mode==='owner'){const k=o.querySelector('#lgk').value.trim();if(!k)throw new Error('اكتبي كلمة المرور');ls.del('acc_token');ls.set('acc_key',k)}
      else{
        const name=o.querySelector('#lgn').value.trim(),pin=o.querySelector('#lgp').value.trim();if(!name)throw new Error('اكتب اسمك');
        let dev=ls.get('acc_device');if(!dev){dev=(crypto.randomUUID?crypto.randomUUID():'d'+Date.now()+Math.random())+'-'+(crypto.randomUUID?crypto.randomUUID():Math.random());ls.set('acc_device',dev)}
        const r=await fetch(FN_LOGIN+'?_t='+Date.now(),{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'staff_login',payload:{name,pin,device_token:dev}})});
        const j=await r.json();
        if(j.device_pending)throw new Error('جهازك بانتظار موافقة المالكة. اطلب منها اعتماده من نظام العز ثم حاول مرة ثانية.');
        if(j.device_rejected)throw new Error('تم رفض هذا الجهاز.');
        if(j.error||!j.token)throw new Error(j.error||'تعذّر الدخول');
        ls.set('acc_token',j.token);ls.del('acc_key');if(j.user)ls.set('acc_user',JSON.stringify(j.user));
      }
      await boot(true);
    }catch(e){
      if(e.code===401){ls.del('acc_key');m.textContent=mode==='owner'?'كلمة المرور غير صحيحة':'ليس لديك صلاحية «فانسي سنس». اطلب من المالكة تفعيلها لحسابك.'}
      else m.textContent=e.message;
    }finally{btn.disabled=false;btn.textContent='دخول'}
  };
  btn.onclick=go;o.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')go()});
}
function logout(){if(LOCAL)return toast('وضع محلي');ls.del('acc_token');ls.del('acc_key');location.reload()}
async function boot(fromLogin){
  if(!LOCAL&&!ls.get('acc_token')&&!ls.get('acc_key')){showLogin();return}
  if(!fromLogin)$('#view').innerHTML='<div class="loading">⏳ جاري تحميل البيانات…</div>';
  try{await loadAll()}catch(e){if(e.code===401){if(fromLogin)throw e;showLogin(ls.get('acc_token')?'ليس لديك صلاحية «فانسي سنس» أو انتهت الجلسة':'');return}
    $('#view').innerHTML=`<div class="empty"><div class="ico">⚠️</div><h3>تعذّر الاتصال بالخادم</h3><p>${esc(e.message)}</p><button class="btn pri" onclick="boot()">إعادة المحاولة</button></div>`;return}
  document.querySelector('.login')?.remove();
  $('#me').textContent=ME;$('#me2').textContent=ME;$('#av').textContent=(ME||'م').trim()[0];
  BOOTED=true;runRecurring();route();
}
boot();
</script>
</body>
