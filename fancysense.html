<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Fancy Sense — المحاسبة</title>
<style>
:root{--bg:#0f1720;--panel:#16212e;--panel2:#1c2a3a;--line:#2a3a4d;--txt:#e7eef6;--muted:#93a3b5;--accent:#e0218a;--accent2:#ff5db1;--green:#0e9d6a;--red:#e5484d;--amber:#d98a00;--brand:#c9b037;--radius:12px}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
a{color:var(--accent2)}
.hidden{display:none!important}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(90deg,#1b2a3a,#16212e);border-bottom:2px solid var(--accent);position:sticky;top:0;z-index:30;flex-wrap:wrap}
.brand{font-weight:900;font-size:19px;letter-spacing:1px}
.brand span{color:var(--accent2)}
.brand small{display:block;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:2px}
.topbar .sp{flex:1}
.btn{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:8px 15px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
.btn.green{background:var(--green)}
.btn.red{background:var(--red)}
.btn.sm{padding:3px 10px;font-size:11px;border-radius:7px}
.tabs{display:flex;gap:4px;padding:8px 12px;background:var(--panel);overflow-x:auto;border-bottom:1px solid var(--line);position:sticky;top:51px;z-index:20}
.tab{white-space:nowrap;padding:8px 14px;border-radius:9px 9px 0 0;cursor:pointer;color:var(--muted);font-weight:700;font-size:13px;border:1px solid transparent}
.tab.on{color:#fff;background:var(--panel2);border-color:var(--line);border-bottom-color:var(--panel2)}
.wrap{max-width:1300px;margin:0 auto;padding:16px}
.page{display:none}
.page.on{display:block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px}
.panel h3{margin:0 0 10px;font-size:15px;border-right:4px solid var(--accent);padding-right:9px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld.full{grid-column:1/-1}
.fld label{font-size:12px;color:var(--muted);font-weight:600}
.fld input,.fld select,.fld textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--txt);font-size:13px;font-family:inherit}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.kpi .ttl{font-size:11px;color:var(--muted);font-weight:600}
.kpi .val{font-size:20px;font-weight:800;margin-top:4px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap}
th,td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:right}
th{background:var(--panel2);color:var(--muted);font-weight:700;position:sticky;top:0}
tbody tr:hover{background:rgba(224,33,138,.06)}
.num{font-variant-numeric:tabular-nums}
.pos{color:#2fd196}.neg{color:#ff6b7a}.mut{color:var(--muted)}
.pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}
.pill.g{background:rgba(14,157,106,.18);color:#2fd196}
.pill.r{background:rgba(229,72,77,.18);color:#ff6b7a}
.msg{font-size:12px;min-height:16px;margin:6px 0}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center}
.gate .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 26px;width:320px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-size:12px}
.chip button{background:none;border:none;color:var(--red);cursor:pointer;font-size:13px;padding:0;line-height:1}
.sub{font-size:11.5px;color:var(--muted)}
.mini{font-size:10px;color:var(--muted)}
</style>
</head>
<body>

<!-- بوابة بسيطة -->
<div id="gate" class="gate">
  <div class="card">
    <div class="brand" style="font-size:24px">FANCY<span> SENSE</span><small>المحاسبة</small></div>
    <p class="sub" style="margin:14px 0 10px">الدخول موحّد مع نظام العز الدولية — سجّلي الدخول هناك ثم افتحي فانسي سنس.</p>
    <a href="accounting.html" class="btn" style="width:100%;display:block;text-decoration:none;box-sizing:border-box">🔑 الدخول عبر نظام العز</a>
    <div id="gate-msg" class="msg" style="color:var(--amber);margin-top:10px"></div>
  </div>
</div>

<!-- التطبيق -->
<div id="app" class="hidden">
<div class="topbar">
  <div class="brand">FANCY<span> SENSE</span><small>نظام المحاسبة — اكسسوارات وعدسات</small></div>
  <div class="sp"></div>
  <span id="hdr-info" class="sub"></span>
  <button class="btn ghost sm" onclick="loadAll()">🔄 تحديث</button>
  <a href="accounting.html" class="btn ghost sm" style="text-decoration:none">← العز الدولية</a>
</div>
<div class="tabs" id="tabs"></div>
<div class="wrap">
  <div class="page on" id="p-dash"></div>
  <div class="page" id="p-sales"></div>
  <div class="page" id="p-machine"></div>
  <div class="page" id="p-expenses"></div>
  <div class="page" id="p-rewa"></div>
  <div class="page" id="p-match"></div>
  <div class="page" id="p-credit"></div>
  <div class="page" id="p-banks"></div>
  <div class="page" id="p-inv"></div>
  <div class="page" id="p-settings"></div>
</div>
</div>

<script>
// 🔐 نفس دخول نظام العز (نفس النطاق → localStorage مشترك): لا مفتاح مضمّن
const FN='https://ofotvacszlmrqxzfjmtn.supabase.co/functions/v1/fs-dashboard';
let KEY=localStorage.getItem('acc_key')||'', TOKEN=localStorage.getItem('acc_token')||'', DATA=null;

// ---- أدوات ----
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=v=>{const x=Number(v);return isNaN(x)?0:x;};
const fmt=v=>n(v).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:3});
const today=()=>new Date().toISOString().slice(0,10);
const cur=()=>(DATA&&DATA.config&&DATA.config.currency)||'OMR';
const taxRate=()=>n((DATA&&DATA.config&&DATA.config.tax_rate)||0);
function listVals(cat){return (DATA&&DATA.lists||[]).filter(l=>l.category===cat).map(l=>l.value);}
function opts(cat,sel){return '<option value="">—</option>'+listVals(cat).map(v=>'<option'+(v===sel?' selected':'')+'>'+esc(v)+'</option>').join('');}

async function api(method,action,payload){
  const opt={method,cache:'no-store',headers:{}};
  if(KEY)opt.headers['x-acc-key']=KEY; if(TOKEN)opt.headers['x-acc-token']=TOKEN;
  if(method==='POST'){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify({action,payload});}
  const qs='?_t='+Date.now()+(KEY?('&key='+encodeURIComponent(KEY)):'')+(TOKEN?('&token='+encodeURIComponent(TOKEN)):'');
  const r=await fetch(FN+qs,opt);
  if(r.status===401){ needLogin(); throw new Error('انتهت الجلسة — سجّلي الدخول من نظام العز'); }
  return r.json();
}
async function loadAll(){
  try{ DATA=await api('GET'); if(DATA.error){alert('خطأ: '+DATA.error);return;} render(); }
  catch(e){ /* 401 يعالَج في api */ }
}
function needLogin(){ $('app').classList.add('hidden'); $('gate').classList.remove('hidden'); $('gate-msg').innerHTML='لازم تسجّلي الدخول من <b>نظام العز</b> أولاً (نفس الجلسة).'; }
async function crud(action,table,data,id){
  try{
    const j=await api('POST',action,{table,data,id});
    if(j&&j.error){ toast('⚠️ خطأ: '+j.error,true); return false; }
    await loadAll(); toast('✅ تم الحفظ'); return true;
  }catch(e){ toast('⚠️ تعذّر الحفظ: '+(e&&e.message||e),true); return false; }
}
function toast(msg,err){ let t=$('fs-toast'); if(!t){ t=document.createElement('div'); t.id='fs-toast'; t.style.cssText='position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:11px 20px;border-radius:10px;font-weight:700;font-size:14px;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,.4)'; document.body.appendChild(t); }
  t.style.background=err?'#e5484d':'#0e9d6a'; t.style.color='#fff'; t.textContent=msg; t.style.display='block'; clearTimeout(window._fsTT); window._fsTT=setTimeout(()=>{t.style.display='none';},err?5000:2200); }

// ---- البوابة (موحّدة مع نظام العز) ----
function showApp(){ $('gate').classList.add('hidden'); $('app').classList.remove('hidden'); loadAll(); }

// ---- التبويبات ----
const TABS=[['dash','📊 لوحة'],['sales','🧾 المبيعات اليومية'],['machine','🏧 متابعة المكنة'],['expenses','💸 مصاريف يومية'],['rewa','🔄 مطابقة REWA'],['match','🔗 مطابقة بنوك العز'],['credit','👤 عملاء الآجل'],['banks','🏦 البنوك والإيداعات'],['inv','📦 منتجات ناقصة'],['settings','⚙️ إعدادات']];
function buildTabs(){ $('tabs').innerHTML=TABS.map((t,i)=>'<div class="tab'+(i===0?' on':'')+'" data-p="'+t[0]+'" onclick="switchTab(this)">'+t[1]+'</div>').join(''); }
function switchTab(el){ document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on')); el.classList.add('on'); const p=el.dataset.p; document.querySelectorAll('.page').forEach(pg=>pg.classList.remove('on')); $('p-'+p).classList.add('on'); }

// ---- فورم قابل للطيّ ----
function formToggle(id){ const f=$(id); if(f)f.classList.toggle('hidden'); }

const FS_VER='v53';
function render(){
  $('hdr-info').textContent=(DATA.config.company||'Fancy Sense')+' · '+cur()+' · ضريبة '+taxRate()+'% · '+FS_VER;
  renderDash(); renderSales(); renderMachine(); renderExpenses(); renderRewa(); renderMatch(); renderCredit(); renderBanks(); renderInv(); renderSettings();
}

// ===== 🔗 مطابقة بنوك العز (للعرض فقط) =====
function renderMatch(){
  const C=cur();
  const F={from:window._mFrom||'',to:window._mTo||''};
  const statusF=window._mStatus||'all';   // all | matched | unmatched
  const inr=(d)=>{ d=String(d||'').slice(0,10); if(F.from&&d<F.from)return false; if(F.to&&d>F.to)return false; return true; };
  // المكنة تنزل البنك باليوم التالي → نرجّع تاريخ مكنة البنك يوماً للخلف ليطابق يوم المبيعة في فانسي
  const shiftDay=(ds,k)=>{ ds=String(ds||'').slice(0,10); const p=ds.split('-'); if(p.length<3)return ds; const dt=new Date(Date.UTC(+p[0],+p[1]-1,+p[2])); if(isNaN(dt))return ds; dt.setUTCDate(dt.getUTCDate()+k); return dt.toISOString().slice(0,10); };
  // قوننة اسم الفرع (يوحّد مسمّيات فانسي والعز) → كيوسك / شوب / عمان / غير محدّد
  const brCanon=(s)=>{ s=String(s||''); if(/معرض|معارض/.test(s))return 'معارض'; if(/kiosk|كيوسك/i.test(s))return 'كيوسك'; if(/shop|شوب|store|محل/i.test(s))return 'شوب'; if(/salah|صلال/i.test(s)||/عمان(?![يى])/.test(s)||/(^|[^a-z])oman([^a-z]|$)/i.test(s))return 'عمان'; return 'غير محدّد'; };   /* معارض نشاط منفصل · «عمانى» جنسية ليست فرع عمان */
  // تصنيف حركة العز من حقل التفصيل → {الفرع, النوع, المبلغ}؛ تُستبعد صفوف التجربة
  const azClass=(x)=>{ if(/^\s*test\s*$/i.test(String(x.details||'')))return null; const t=[x.details,x.description,x.more_details].map(v=>String(v||'')).join(' '); const out=n(x.out_raw),inc=n(x.in_raw); let type; if(out>0)type='مصروفات'; else if(/اجل|آجل/.test(t))type='آجل'; else if(/صندوق/.test(t))type='صندوق'; else if(/تحويل/.test(t))type='تحويل'; else type='مكنة'; return {branch:brCanon(t),type:type,amount:out>0?out:inc}; };
  const TYPES=['مكنة','صندوق','تحويل','آجل'];   // المصروفات محذوفة من المقارنة (لا داعي لمقارنتها)
  const TI={'مكنة':'🏧','صندوق':'📥','تحويل':'🔄','آجل':'📒','مصروفات':'💸'};
  const BR=['كيوسك','شوب','عمان','معارض','غير محدّد'];
  const matchable=(br)=>br==='كيوسك'||br==='شوب'||br==='عمان';
  // تجميع: fsM[date][branch][type] و azM[date][branch][type]
  const fsM={},azM={},azMachDate={};   // azMachDate[يوم المبيعة] = {تاريخ دخول البنك الفعلي: المبلغ} — عرض فقط لتوثيق ترحيل المكنة
  const add=(M,d,br,t,v)=>{ if(!d)return; M[d]=M[d]||{}; M[d][br]=M[d][br]||{}; M[d][br][t]=(M[d][br][t]||0)+n(v); };
  (DATA.daily_sales||[]).forEach(x=>{ const d=String(x.sale_date||'').slice(0,10); if(!inr(d))return; const br=brCanon(x.branch); add(fsM,d,br,'مكنة',x.machine); let tr=n(x.bank_transfer); if(!tr&&Array.isArray(x.transfers))tr=x.transfers.reduce((a,t)=>a+n(t&&t.amount),0); add(fsM,d,br,'تحويل',tr); });
  (DATA.atm_deposit||[]).forEach(x=>{ const d=String(x.dep_date||'').slice(0,10); if(!inr(d))return; add(fsM,d,brCanon(x.branch),'صندوق',x.amount); });
  (DATA.expenses||[]).forEach(x=>{ const d=String(x.exp_date||'').slice(0,10); if(!inr(d))return; add(fsM,d,brCanon(x.branch),'مصروفات',x.amount); });
  // 📒 الآجل = المُحصَّل الفعلي (credit_txn.paid) — حركة بنكية على مستوى الشركة (بلا فرع) → «غير محدّد»؛ البيع الآجل اليومي ليس حركة بنكية فلا يُدرَج
  (DATA.credit_txn||[]).forEach(x=>{ const d=String(x.txn_date||'').slice(0,10); if(!inr(d))return; add(fsM,d,'غير محدّد','آجل',x.paid_amount); });
  (DATA.acc_fancy||[]).forEach(x=>{ const c=azClass(x); if(!c)return; const orig=String(x.tx_date||'').slice(0,10); let d=orig; if(c.type==='مكنة')d=shiftDay(d,-1);   /* مكنة البنك تنزل باليوم التالي → ترجيع يوم */ if(!inr(d))return; add(azM,d,c.branch,c.type,c.amount); if(c.type==='مكنة'){ azMachDate[d]=azMachDate[d]||{}; azMachDate[d][orig]=(azMachDate[d][orig]||0)+n(c.amount); } });
  // 🔄 تفاصيل الحوالات البنكية لكل تاريخ (فانسي + تقرير البنك) — تظهر تحت إجمالي التحويل
  const fsTr={},azTr={};
  (DATA.daily_sales||[]).forEach(x=>{ const d=String(x.sale_date||'').slice(0,10); if(!inr(d))return; const br=brCanon(x.branch);
    if(Array.isArray(x.transfers)&&x.transfers.length){ x.transfers.forEach(t=>{ const a=n(t&&t.amount); if(a)(fsTr[d]=fsTr[d]||[]).push({amount:a,bank:(t&&(t.bank||t.bank_name))||'',branch:br}); }); }
    else { const a=n(x.bank_transfer); if(a)(fsTr[d]=fsTr[d]||[]).push({amount:a,bank:'',branch:br}); } });
  (DATA.acc_fancy||[]).forEach(x=>{ const d=String(x.tx_date||'').slice(0,10); if(!inr(d))return; const c=azClass(x); if(!c||c.type!=='تحويل')return; (azTr[d]=azTr[d]||[]).push({amount:c.amount,bank:x.bank_name||'',ref:x.bank_ref||''}); });
  const get=(M,d,br,t)=>(((M[d]||{})[br]||{})[t])||0;
  const dates=[...new Set([...Object.keys(fsM),...Object.keys(azM)])].sort().reverse();
  const grandF={},grandA={}; TYPES.forEach(t=>{grandF[t]=0;grandA[t]=0;});
  // كشف مختصر لكل يوم (تاريخ · فرق الوارد · الحالة) يتوسّع للتفاصيل عند الضغط
  const INFLOW=['مكنة','صندوق','تحويل','آجل'];   // الوارد للبنك؛ المصروفات مستثناة من حساب الفرق والحالة
  const detHead='<tr style="font-size:11px;color:var(--muted)"><th style="text-align:right">الفرع</th>'+TYPES.map(t=>'<th>'+TI[t]+' '+t+'</th>').join('')+'<th>إجمالي</th></tr>';
  const rows_html=[], dailyExp=[];
  dates.forEach((d,di)=>{
    const brs=BR.filter(br=> (fsM[d]&&fsM[d][br]) || (azM[d]&&azM[d][br]) );
    const cv=(v)=>(Math.abs(v)>=0.005?fmt(v):'<span class="mut">·</span>');   // قيمة أو نقطة
    // تجميع الملخّص العام
    TYPES.forEach(t=>{ grandF[t]+=brs.reduce((a,br)=>a+get(fsM,d,br,t),0); grandA[t]+=brs.reduce((a,br)=>a+get(azM,d,br,t),0); });
    // ===== قسم أ: مجمّع — كل الفروع (المكنة + الآجل) — البنك يجمّعها بلا فرع =====
    const AGG=['مكنة','آجل'];
    const aggRows=AGG.map(t=>{ const f=brs.reduce((a,br)=>a+get(fsM,d,br,t),0), a=brs.reduce((s,br)=>s+get(azM,d,br,t),0), dv=f-a, hd=Math.abs(dv)>=0.005;
      // 💳 نسبة العمولة = ما أخذه البنك ÷ فانسي (المكنة تاخذ عمولة فيطلع البنك أقل)
      const pct = f>0.005 ? (dv/f*100) : null;
      const pctCell = (pct==null)?'<span class="mut">—</span>':('<span style="color:'+(pct>0?'#e0a83a':(pct<-0.01?'#ff6b7a':'#2fd196'))+';font-weight:700">'+pct.toFixed(2)+'%</span>');
      // 📅 تاريخ دخول المكنة الفعلي بالبنك (عرض فقط) — يُكتب تحت مبلغ البنك ليتأكّد أن مكنة اليوم طابقت دخول اليوم التالي
      let bankCell=cv(a);
      if(t==='مكنة'&&a>0.005&&azMachDate[d]){ const dm=(s)=>{const p=String(s).split('-');return p.length>=3?p[2]+'/'+p[1]:s;}; const lbl=Object.keys(azMachDate[d]).sort().map(dm).join('، '); bankCell+='<div style="font-size:9px;color:var(--muted);font-weight:600;margin-top:2px">📅 دخل البنك '+lbl+'</div>'; }
      return '<tr><td style="font-weight:700">'+TI[t]+' '+t+'</td><td class="num">'+cv(f)+'</td><td class="num" style="color:#3aa0ff">'+bankCell+'</td><td class="num" style="font-weight:800;color:'+(hd?'#ff6b7a':'#2fd196')+(hd?';background:rgba(229,72,77,.08)':'')+'">'+(hd?fmt(dv):'✓')+'</td><td class="num">'+pctCell+'</td></tr>'; }).join('');
    const aggTable='<div style="font-weight:800;font-size:12px;color:var(--accent);margin:0 0 3px">📊 مجمّع — كل الفروع <span style="font-size:10px;color:var(--muted);font-weight:600">(المكنة والآجل — البنك يجمّعها بلا فرع · مكنة البنك مُرحَّلة ليوم المبيعة لأنها تنزل باليوم التالي)</span></div><div class="tbl-wrap"><table style="margin:0 0 12px;font-size:12px"><thead><tr style="font-size:11px;color:var(--muted)"><th style="text-align:right">النوع</th><th>فانسي</th><th>🔵 تقرير البنك</th><th>الفرق</th><th>💳 نسبة العمولة<br><span style="font-size:8.5px">ما أخذه البنك</span></th></tr></thead><tbody>'+aggRows+'</tbody></table></div>';
    // ===== قسم ب: مفصّل بالفرع (الصندوق + التحويل) =====
    const DET=['صندوق','تحويل'];

    '<div style="margin-top:30px;font-size:12px;color:#666">إعداد: نظام محاسبة فانسي سنس · للعرض والمراجعة فقط</div>'+
    '<'+'script>window.onload=function(){setTimeout(function(){window.focus();window.print();},350);};<'+'/script></body></html>';
  const w=window.open('','_blank'); if(w){ w.document.write(html); w.document.close(); } else { alert('اسمحي بالنوافذ المنبثقة لعرض التقرير'); }
}

// ===== 🏧 متابعة المكنة (POS) =====
function renderMachine(){
  const C=cur();
  const F={from:window._mcFrom||'',to:window._mcTo||''};
  const inr=(d)=>{ d=String(d||'').slice(0,10); if(F.from&&d<F.from)return false; if(F.to&&d>F.to)return false; return true; };
  const brCanon=(s)=>{ s=String(s||''); if(/معرض|معارض/.test(s))return 'معارض'; if(/kiosk|كيوسك/i.test(s))return 'كيوسك'; if(/shop|شوب|store|محل/i.test(s))return 'شوب'; if(/salah|صلال/i.test(s)||/عمان(?![يى])/.test(s)||/(^|[^a-z])oman([^a-z]|$)/i.test(s))return 'عمان'; return 'غير محدّد'; };
  const azClass=(x)=>{ if(/^\s*test\s*$/i.test(String(x.details||'')))return null; const t=[x.details,x.description,x.more_details].map(v=>String(v||'')).join(' '); const out=n(x.out_raw),inc=n(x.in_raw); let type; if(out>0)type='مصروفات'; else if(/اجل|آجل/.test(t))type='آجل'; else if(/صندوق/.test(t))type='صندوق'; else if(/تحويل/.test(t))type='تحويل'; else type='مكنة'; return {branch:brCanon(t),type:type,amount:out>0?out:inc}; };
  // ⚠️ حساب تواريخ آمن زمنياً (UTC بحت) — بلا new Date(local) حتى لا تزحلق المنطقة الزمنية (عُمان +4) يوماً إضافياً
  const shiftDay=(ds,k)=>{ ds=String(ds||'').slice(0,10); const p=ds.split('-'); if(p.length<3)return ds; const dt=new Date(Date.UTC(+p[0],+p[1]-1,+p[2])); if(isNaN(dt))return ds; dt.setUTCDate(dt.getUTCDate()+k); return dt.toISOString().slice(0,10); };
  // المكنة (الموظفة) + روا لكل تاريخ/فرع
  const mByDate={};
  (DATA.daily_sales||[]).forEach(x=>{ const d=String(x.sale_date||'').slice(0,10); if(!inr(d))return; const br=(x.branch||'—'); mByDate[d]=mByDate[d]||{}; const o=mByDate[d][br]=mByDate[d][br]||{machine:0,rewa:0,note:''}; o.machine+=n(x.machine); o.rewa+=n(x.rewa_machine); const nt=x.note_machine||x.note; if(nt)o.note=(o.note?o.note+' · ':'')+String(nt); });
  // دخل البنك: (1) الأساس = عمود «Deposted in Bank» من الشيت (fs_machine_deposit) — مسجَّل بيوم المبيعة (لا زحلقة)، وتاريخ الدخول الفعلي = اليوم التالي
  //           (2) احتياط = بنك العز (acc_fancy) للأيام التي لا إيداع لها في الشيت فقط — مزحلق يوماً (تاريخ البنك D+1 ↔ مبيعات D)، لأن العز يؤرّخ بيوم الدخول الفعلي
  const bankByDate={}, bankSrc={}, bankDates={};
  const _addBD=(d,orig)=>{ (bankDates[d]=bankDates[d]||{})[orig]=1; };
  (DATA.machine_deposit||[]).forEach(x=>{ if(x.actual_bank==null)return; const d=String(x.dep_date||'').slice(0,10); if(!inr(d))return; bankByDate[d]=(bankByDate[d]||0)+n(x.actual_bank); bankSrc[d]='fs'; _addBD(d,shiftDay(d,1)); });
  (DATA.acc_fancy||[]).forEach(x=>{ const c=azClass(x); if(!c||c.type!=='مكنة')return; const raw=String(x.tx_date||'').slice(0,10); const d=shiftDay(raw,-1); if(!inr(d)||bankSrc[d]==='fs')return; bankByDate[d]=(bankByDate[d]||0)+c.amount; bankSrc[d]='az'; _addBD(d,raw); });
  const dates=[...new Set([...Object.keys(mByDate),...Object.keys(bankByDate)])].sort().reverse();
  // كل الفروع بمسمياتها الكاملة (كما في المبيعات) من قائمة الفروع المُدارة
  const BRANCHES=(DATA.lists||[]).filter(l=>l.category==='branch').map(l=>l.value);
  let gMac=0,gRewa=0,gBank=0,gUndep=0,gUndepDays=0;
  const blocks=dates.map(d=>{
    const brs=[...new Set([...BRANCHES, ...Object.keys(mByDate[d]||{})])];   // جميع الفروع (حتى بلا بيانات لهذا اليوم)
    let totMac=0,totRewa=0; brs.forEach(br=>{ const o=mByDate[d]&&mByDate[d][br]; if(o){ totMac+=o.machine; totRewa+=o.rewa; } });
    const bank=bankByDate[d]||0, bankDiff=totMac-bank, pct=totMac>0.005?(bankDiff/totMac*100):null;
    // 📅 تاريخ دخول البنك الفعلي (اليوم التالي) — عرض تحت المبلغ ليتأكّد أن مبيعات اليوم تقابل دخول اليوم التالي
    const _dm=(s)=>{const p=String(s).split('-');return p.length>=3?p[2]+'/'+p[1]:s;};
    const bkDays=bankDates[d]?Object.keys(bankDates[d]).sort().map(_dm).join('، '):'';
    const bkSrcTag=(bankSrc[d]==='az'?' <span style="color:#3aa0ff">🏦 بنك العز</span>':'');   // مصدر احتياطي (ليس من الشيت)
    gMac+=totMac; gRewa+=totRewa; gBank+=bank;
    // 🎨 لون مطابقة البنك: أخضر=البنك أكثر/مطابق · أصفر=أقل حتى ٣٪ · أحمر=أقل بأكثر من ٣٪ (تنبيه)
    // 📌 «لم يُودع بعد» = فيه مبيعات مكنة ولا يوجد دخل بنك في اليوم التالي (الإيداع ما نزل بعد) — ليس خطأ عمولة، فلا تنبيه أحمر
    const pending=(bank<0.005&&totMac>0.005); if(pending){gUndep+=totMac;gUndepDays++;}
    const clr=pending?'#8aa0b5':((pct==null)?'#9aa':(pct<=0.005?'#2fd196':(pct<=3?'#e0a83a':'#ff6b7a'))), alert=(!pending&&pct!=null&&pct>3);
    const pctTxt=pending?'⏳ لم يُودع':((pct==null)?'—':((pct<=0.005&&pct>=-0.005)?'✓':pct.toFixed(2)+'%')), bankDiffTxt=pending?'⏳':(Math.abs(bankDiff)>=0.005?fmt(bankDiff):'✓');
    const N=Math.max(1,brs.length), sp=' rowspan="'+N+'"', bgT=(alert?'background:rgba(229,72,77,.09);':'background:rgba(58,160,255,.05);')+'vertical-align:middle;';
    const dateCell='<td'+sp+' style="font-weight:800;vertical-align:middle">📅 '+esc(d)+'</td>';
    // 📊 أعمدة ممتدة مقابل تفاصيل الفروع: مجموع المكنة · دخل البنك · الفرق · النسبة
    const spanCells='<td'+sp+' class="num" style="font-weight:800;'+bgT+'">'+fmt(totMac)+'</td><td'+sp+' class="num" style="font-weight:800;color:#3aa0ff;'+bgT+'">'+fmt(bank)+(bkDays?('<div style="font-size:9px;color:var(--muted);font-weight:600;margin-top:2px">📅 دخل '+bkDays+bkSrcTag+'</div>'):'')+'</td><td'+sp+' class="num" style="font-weight:800;color:'+clr+';'+bgT+'">'+bankDiffTxt+'</td><td'+sp+' class="num" style="font-weight:800;color:'+clr+';'+bgT+'">'+pctTxt+(alert?' ⚠️':'')+'</td>';
    if(!brs.length) return '<tr style="border-top:2px solid rgba(128,128,128,.3)">'+dateCell+spanCells+'<td class="mut" colspan="5" style="text-align:center">لا مبيعات مكنة مسجّلة</td></tr>';
    return brs.map((br,idx)=>{ const o=(mByDate[d]&&mByDate[d][br])||{machine:0,rewa:0,note:''}, diff=o.machine-o.rewa, hd=Math.abs(diff)>=0.005;
      const bc='<td style="font-weight:700">🏪 '+esc(br)+'</td><td class="num">'+fmt(o.machine)+'</td><td class="num" style="color:#3aa0ff">'+fmt(o.rewa)+'</td><td class="num" style="font-weight:700;color:'+(diff<-0.005?'#ff6b7a':'#2fd196')+'">'+(hd?fmt(diff):'✓')+'</td><td style="font-size:11px;color:var(--muted)">'+esc(o.note||'')+'</td>';
      return idx===0 ? ('<tr style="border-top:2px solid rgba(128,128,128,.3)">'+dateCell+spanCells+bc+'</tr>') : ('<tr>'+bc+'</tr>');
    }).join('');
  }).join('');
  // 💳 الفرق الكلي للفترة = مبيعات − مُودع (= عمولة + فروقات توقيت). لا نطرح أيام «لم يُودع» لأن فلوسها غالباً مُودعة ضمن دفعة يوم آخر داخل الفترة
  const gBankDiff=gMac-gBank;
  const gDiffPct=gMac>0.005?(gBankDiff/gMac*100).toFixed(2)+'%':'—';
  const _pr=(F.from||F.to)?('<span style="font-size:12px;color:var(--muted);font-weight:500">('+(F.from||'البداية')+' ← '+(F.to||'الآن')+')</span>'):'<span style="font-size:12px;color:var(--muted);font-weight:500">(كل الفترة)</span>';
  $('p-machine').innerHTML=
    '<div class="panel" style="border:1px solid var(--amber);background:rgba(217,138,0,.07)"><div style="font-weight:700;color:#e0a83a">🏧 متابعة المكنة (POS)</div><div class="sub" style="margin-top:3px">لكل يوم: المكنة لكل فرع (الموظفة) مقابل <b>تقرير روا</b> والفرق · ويقابلها بأعمدة ممتدة <b>مجموع المكنة</b> و<b>دخل البنك</b> (اليوم التالي) والفرق والنسبة.<br>🎨 <b>لون فرق البنك:</b> <span style="color:#2fd196">أخضر</span> = البنك أكثر/مطابق · <span style="color:#e0a83a">أصفر</span> = أقل حتى ٣٪ (عمولة عادية) · <span style="color:#ff6b7a">أحمر ⚠️</span> = أقل بأكثر من ٣٪ (تنبيه).</div></div>'+
    '<div class="panel"><div class="fgrid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));max-width:540px"><div class="fld"><label>📅 من</label><input type="date" value="'+esc(F.from)+'" onchange="window._mcFrom=this.value;renderMachine()"></div><div class="fld"><label>📅 إلى</label><input type="date" value="'+esc(F.to)+'" onchange="window._mcTo=this.value;renderMachine()"></div><div class="fld"><label style="visibility:hidden">.</label><button class="btn ghost" onclick="window._mcFrom=\'\';window._mcTo=\'\';renderMachine()">مسح</button></div></div></div>'+
    '<div class="panel"><h3 style="margin:0 0 8px">📊 ملخّص الفترة '+_pr+'</h3><div class="kpis">'+
      kpi('🏧 إجمالي مبيعات المكنة',fmt(gMac)+' '+C)+
      kpi('🏦 المُودع بالبنك',fmt(gBank)+' '+C)+
      kpi('💳 الفرق (عمولة + فروقات توقيت)',fmt(gBankDiff)+' '+C+' · '+gDiffPct,'neg')+
      kpi('⏳ أيام بلا إيداع مسجّل',gUndepDays+' يوم'+(gUndep>0.005?(' · '+fmt(gUndep)+' '+C):''))+
      '</div><div class="sub" style="margin-top:7px"><b>الفرق</b> = إجمالي المبيعات − المُودع بالبنك (= العمولة + أي فروقات توقيت). «أيام بلا إيداع مسجّل» للمتابعة فقط — فلوسها قد تكون أُودعت ضمن دفعة يوم آخر، فلا تُطرح من الحساب. غيّري التاريخ فوق ليتحدّث الملخّص.</div></div>'+
    '<div class="panel"><h3>🗓️ متابعة المكنة اليومية</h3><div class="tbl-wrap bf-scroll" style="max-height:620px"><table style="font-size:12px"><thead><tr><th>التاريخ</th><th style="background:#0e7a5a">📊 مجموع المكنة<br><span style="font-size:8px">كل الفروع</span></th><th style="background:#0e7a5a">🏦 دخل البنك<br><span style="font-size:8px">ت+1</span></th><th style="background:#0e7a5a">الفرق<br><span style="font-size:8px">مكنة−بنك</span></th><th style="background:#0e7a5a">💳 النسبة</th><th>الفرع</th><th>🏧 تقرير الموظفة</th><th>🔄 تقرير روا</th><th>الفرق<br><span style="font-size:8px;color:var(--muted)">موظفة−روا</span></th><th>📝 ملاحظة</th></tr></thead><tbody>'+(blocks||'<tr><td colspan="10" class="mut" style="text-align:center;padding:14px">لا بيانات</td></tr>')+'</tbody></table></div></div>';
}

async function saveExp(){

function slDiff(){
  const ch=[['sl-machine','sl-rmachine','d-machine'],['sl-cash','sl-rcash','d-cash']];
  let te=0,tr=0;
  ch.forEach(c=>{ const e=n(($(c[0])||{}).value), r=n(($(c[1])||{}).value); te+=e; tr+=r; const d=e-r; const el=$(c[2]); if(el){ el.textContent=fmt(d); el.style.color=Math.abs(d)<0.005?'#2fd196':'#ff6b7a'; } });
  // الآجل (مجموع أسطر العملاء) مقابل REWA
  let crAmt=0; document.querySelectorAll('#sl-credit-rows .sl-cr-row').forEach(row=>{ const i=row.dataset.i; crAmt+=n(($('cr-amt-'+i)||{}).value); });
  if($('sl-credit'))$('sl-credit').value=+crAmt.toFixed(3);
  if($('sl-credit-d'))$('sl-credit-d').textContent=fmt(crAmt);
  const rcr=n(($('sl-rcredit')||{}).value); const dcr=crAmt-rcr; const dce=$('d-credit'); if(dce){ dce.textContent=fmt(dcr); dce.style.color=Math.abs(dcr)<0.005?'#2fd196':'#ff6b7a'; }
  te+=crAmt; tr+=rcr;
  // التحويلات البنكية (مجموع الأسطر) مقابل REWA
  let trAmt=0; document.querySelectorAll('#sl-transfer-rows .sl-tr-row').forEach(row=>{ const i=row.dataset.i; trAmt+=n(($('tr-amt-'+i)||{}).value); });
  if($('sl-transfer'))$('sl-transfer').value=+trAmt.toFixed(3);
  if($('sl-transfer-d'))$('sl-transfer-d').textContent=fmt(trAmt);
  const rtr=n(($('sl-rtransfer')||{}).value); const dtr=trAmt-rtr; const dte=$('d-transfer'); if(dte){ dte.textContent=fmt(dtr); dte.style.color=Math.abs(dtr)<0.005?'#2fd196':'#ff6b7a'; }
  te+=trAmt; tr+=rtr;
  if($('sl-total'))$('sl-total').value=+te.toFixed(3);
  if($('sl-rtotal'))$('sl-rtotal').value=+tr.toFixed(3);
  if($('sl-total-d'))$('sl-total-d').textContent=fmt(te);
  if($('sl-rtotal-d'))$('sl-rtotal-d').textContent=fmt(tr);
  const gd=te-tr; const g=$('sl-tdiff'); if(g){ g.textContent=fmt(gd); g.style.color=Math.abs(gd)<0.005?'#2fd196':'#ff6b7a'; }
}

  if(!b){ $('sl-msg').innerHTML='<span class="neg">اختاري الفرع</span>'; return; }

  const data={sale_date:d,branch:b,
    machine:n($('sl-machine').value),cash:n($('sl-cash').value),credit_sales:n($('sl-credit').value),bank_transfer:n($('sl-transfer').value),total:n($('sl-total').value),
    rewa_machine:n($('sl-rmachine').value),rewa_cash:n($('sl-rcash').value),rewa_credit:n($('sl-rcredit').value),rewa_transfer:n($('sl-rtransfer').value),rewa_total:n($('sl-rtotal').value),
    returns:n($('sl-returns').value),tax_rate:taxRate(),note:$('sl-note').value||null,
    note_machine:$('sl-nmachine').value||null,note_cash:$('sl-ncash').value||null,note_credit:$('sl-ncredit').value||null,note_transfer:$('sl-ntransfer').value||null};

  data.transfers = transfers.length?transfers:null;
  // تفاصيل الآجل (عميل لكل سطر) — تُضاف كفواتير في حساب العميل
  const credits=[], creditTxns=[]; const _custName={}; ((DATA&&DATA.credit_customers)||[]).forEach(c=>_custName[c.id]=c.name);
  document.querySelectorAll('#sl-credit-rows .sl-cr-row').forEach(row=>{ const i=row.dataset.i; const amt=n(($('cr-amt-'+i)||{}).value); if(amt>0){ const cid=($('cr-cust-'+i)||{}).value||''; const nt=($('cr-note-'+i)||{}).value||null; credits.push({amount:amt,customer:cid?(_custName[cid]||''):null,customer_id:cid?Number(cid):null,note:nt}); if(cid)creditTxns.push({customer_id:Number(cid),txn_date:d,invoice_amount:amt,note:(nt||('آجل مبيعات '+d+(b?(' · '+b):'')))}); } });
  data.credits = credits.length?credits:null;
  // اجمعي مصاريف هذا اليوم (قبل الحفظ لأن إعادة الرسم تمسح الصفوف)
  const expRows=[]; document.querySelectorAll('#sl-exp-rows .sl-exp-row').forEach(r=>{ const i=r.dataset.i; const amt=n(($('se-amt-'+i)||{}).value); if(amt>0){ expRows.push({exp_date:d,branch:b,category:($('se-cat-'+i)||{}).value||null,amount:amt,pay_method:($('se-pm-'+i)||{}).value||null,note:($('se-note-'+i)||{}).value||null}); } });
  try{
    const j=await api('POST','insert',{table:'daily_sales',data});

    let okN=0; for(const e of expRows){ const je=await api('POST','insert',{table:'expenses',data:e}); if(je&&je.error){ toast('⚠️ خطأ بمصروف: '+je.error,true); } else okN++; }
    let okC=0; for(const t of creditTxns){ const jt=await api('POST','insert',{table:'credit_txn',data:t}); if(jt&&jt.error){ toast('⚠️ خطأ بآجل عميل: '+jt.error,true); } else okC++; }
    toast('✅ تم الحفظ'+(okN?(' + '+okN+' مصروف'):'')+(okC?(' + '+okC+' آجل عميل'):''));
    formToggle('sales-form');
    await loadAll();
  }catch(e){ toast('⚠️ تعذّر الحفظ: '+(e&&e.message||e),true); }

  const bRows=(DATA.bank_txn||[]).map(x=>'<tr><td>'+esc(x.actual_date||'')+'</td><td>'+esc(x.close_date||'')+'</td><td>'+esc(x.bank_name||'')+'</td><td><span class="pill '+(x.direction==='out'?'r':'g')+'">'+(x.direction==='out'?'صادر':'وارد')+'</span></td><td class="num '+(x.direction==='out'?'neg':'pos')+'" style="font-weight:800">'+fmt(x.amount)+'</td><td class="mini">'+esc(x.note||'')+'</td><td><button class="btn red sm" onclick="delRow(\'bank_txn\','+x.id+')">حذف</button></td></tr>').join('');
  const aRows=(DATA.atm_deposit||[]).map(x=>'<tr><td>'+esc(x.dep_date||'')+'</td><td>'+esc(x.branch||'')+'</td><td class="num pos" style="font-weight:800">'+fmt(x.amount)+'</td><td>'+esc(x.bank||'—')+'</td><td class="mini">'+esc(x.note||'')+'</td><td><button class="btn red sm" onclick="delRow(\'atm_deposit\','+x.id+')">حذف</button></td></tr>').join('');
  $('p-banks').innerHTML=
    '<div class="panel" style="border:1px solid var(--amber);background:rgba(217,138,0,.08)"><div style="font-size:12.5px;color:#e0a83a;font-weight:700">📌 كشف مراجعة لفانسي سنس فقط — للاطلاع</div><div class="sub" style="margin-top:4px">كل البنوك والإيداعات هنا <b>منفصلة تماماً عن بنوك نظام العز الدولية</b> ولا تنعكس عليها إطلاقاً. هذه بيانات فانسي سنس المستقلّة.</div></div>'+
    '<div class="panel"><div class="row-between"><h3 style="margin:0">🏦 حركات البنوك</h3><button class="btn" onclick="formToggle(\'bank-form\')">➕ حركة بنك</button></div></div>'+bForm+
    '<div class="panel"><div class="tbl-wrap"><table><thead><tr><th>التاريخ الفعلي</th><th>الإقفال</th><th>البنك</th><th>النوع</th><th>القيمة</th><th>ملاحظة</th><th></th></tr></thead><tbody>'+(bRows||'<tr><td colspan="7" class="mut" style="text-align:center;padding:12px">لا حركات</td></tr>')+'</tbody></table></div></div>'+
    '<div class="panel"><div class="row-between"><h3 style="margin:0">🏧 إيداعات الصندوق (الكاش)</h3><button class="btn" onclick="formToggle(\'atm-form\')">➕ إيداع</button></div></div>'+aForm+
    '<div class="panel"><div class="tbl-wrap"><table><thead><tr><th>التاريخ</th><th>الفرع</th><th>المبلغ</th><th>البنك</th><th>ملاحظة</th><th></th></tr></thead><tbody>'+(aRows||'<tr><td colspan="6" class="mut" style="text-align:center;padding:12px">لا إيداعات</td></tr>')+'</tbody></table></div></div>';
}
async function saveBank(){ const data={actual_date:$('bk-adate').value||null,close_date:$('bk-cdate').value||null,direction:$('bk-dir').value,amount:n($('bk-amt').value),bank_name:$('bk-bank').value||null,note:$('bk-note').value||null}; if(await crud('insert','bank_txn',data)){formToggle('bank-form');} }
async function saveAtm(){ const data={dep_date:$('at-date').value||null,branch:$('at-branch').value||null,amount:n($('at-amt').value),bank:$('at-bank').value||null,note:$('at-note').value||null}; if(await crud('insert','atm_deposit',data)){formToggle('atm-form');} }

// ===== 📦 منتجات ناقصة =====
function renderInv(){
  const form='<div id="inv-form" class="panel hidden" style="border-color:var(--accent)"><div class="row-between"><h3 style="margin:0">➕ فرق جرد</h3><button class="btn ghost sm" onclick="formToggle(\'inv-form\')" title="إغلاق">✕ إغلاق</button></div><div class="fgrid">'+
    fin('الكود','iv-code','text','')+fin('الكمية بالفاتورة','iv-qi','number','0')+fin('السعر','iv-price','number','0')+fin('الكمية الفعلية','iv-qa','number','0')+
    '<div class="fld full"><label>ملاحظة</label><input id="iv-note"></div>'+
    '</div><div id="iv-msg" class="msg"></div><button class="btn green" onclick="saveInv()">💾 حفظ</button> <button class="btn ghost" onclick="formToggle(\'inv-form\')">إلغاء</button></div>';
  const rows=(DATA.inventory_short||[]).map(x=>{ const diff=n(x.qty_invoice)-n(x.qty_actual);
    return '<tr><td>'+esc(x.code||'')+'</td><td class="num">'+fmt(x.qty_invoice)+'</td><td class="num">'+fmt(x.qty_actual)+'</td><td class="num '+(diff!==0?'neg':'pos')+'" style="font-weight:800">'+fmt(diff)+'</td><td class="num">'+fmt(x.price)+'</td><td class="mini">'+esc(x.note||'')+'</td><td><button class="btn red sm" onclick="delRow(\'inventory_short\','+x.id+')">حذف</button></td></tr>'; }).join('');
  $('p-inv').innerHTML='<div class="panel"><div class="row-between"><h3 style="margin:0">📦 منتجات ناقصة / فروقات الجرد</h3><button class="btn" onclick="formToggle(\'inv-form\')">➕ إضافة</button></div></div>'+form+
    '<div class="panel"><div class="tbl-wrap"><table><thead><tr><th>الكود</th><th>الكمية بالفاتورة</th><th>الكمية الفعلية</th><th>الفرق</th><th>السعر</th><th>ملاحظة</th><th></th></tr></thead><tbody>'+(rows||'<tr><td colspan="7" class="mut" style="text-align:center;padding:12px">لا سجلات</td></tr>')+'</tbody></table></div></div>';
}
async function saveInv(){ const data={code:$('iv-code').value||null,qty_invoice:n($('iv-qi').value),price:n($('iv-price').value),qty_actual:n($('iv-qa').value),note:$('iv-note').value||null}; if(await crud('insert','inventory_short',data)){formToggle('inv-form');} }

// ===== ⚙️ إعدادات =====
function renderSettings(){
  $('p-settings').innerHTML=
    '<div class="panel"><h3>💵 نسبة الضريبة والعملة</h3><div class="fgrid">'+
      '<div class="fld"><label>نسبة الضريبة %</label><input id="st-tax" type="number" value="'+taxRate()+'"></div>'+
      '<div class="fld"><label>العملة</label><input id="st-cur" value="'+esc(cur())+'"></div>'+
      '<div class="fld"><label>اسم النشاط</label><input id="st-comp" value="'+esc((DATA.config.company)||'Fancy Sense')+'"></div>'+
    '</div><div id="st-msg" class="msg"></div><button class="btn green" onclick="saveSettings()">💾 حفظ الإعدادات</button></div>'+
    listPanel('الفروع','branch','ادخلي اسم الفرع')+
    listPanel('البنوك','bank','ادخلي اسم/رقم البنك')+
    listPanel('طرق الدفع','payment_method','ادخلي طريقة الدفع')+
    listPanel('فئات المصاريف','expense_cat','ادخلي فئة المصروف');
}
function listPanel(title,cat,ph){
  const items=(DATA.lists||[]).filter(l=>l.category===cat);
  return '<div class="panel"><h3>'+esc(title)+'</h3><div class="chips" style="margin-bottom:10px">'+(items.length?items.map(l=>'<span class="chip">'+esc(l.value)+' <button onclick="delList('+l.id+')" title="حذف">✕</button></span>').join(''):'<span class="sub">لا عناصر</span>')+'</div>'+
    '<div style="display:flex;gap:8px"><input id="lst-'+cat+'" placeholder="'+esc(ph)+'" style="flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--txt)"><button class="btn" onclick="addList(\''+cat+'\')">➕ إضافة</button></div></div>';
}
async function saveSettings(){
  const tax=$('st-tax').value, c=$('st-cur').value, comp=$('st-comp').value;
  await api('POST','set_config',{key:'tax_rate',value:tax});
  await api('POST','set_config',{key:'currency',value:c});
  await api('POST','set_config',{key:'company',value:comp});
  $('st-msg').innerHTML='<span class="pos">✅ حُفظت</span>'; await loadAll();
}
async function addList(cat){ const el=$('lst-'+cat); const v=(el.value||'').trim(); if(!v)return; if(await crud('insert','lists',{category:cat,value:v})){} }
async function delList(id){ if(confirm('حذف العنصر؟')) await crud('delete','lists',null,id); }
async function delRow(table,id){ if(confirm('حذف السطر؟ لا يمكن التراجع.')) await crud('delete',table,null,id); }

// ---- مولّدات حقول ----
function fin(label,id,type,val,extra){ return '<div class="fld"><label>'+label+'</label><input id="'+id+'" type="'+type+'"'+(val!=null&&val!==''?' value="'+esc(val)+'"':(type==='number'?' value="0"':''))+' '+(extra||'')+'></div>'; }
function fsel(label,id,cat){ return '<div class="fld"><label>'+label+'</label><select id="'+id+'">'+opts(cat)+'</select></div>'; }
// بند بمبلغ + ملاحظة تحته (لإظهار الفارق لكل بند)
function fch(label,idAmt,idNote){ return '<div class="fld"><label>'+label+'</label><input id="'+idAmt+'" type="number" value="0" oninput="slTotal()"><input id="'+idNote+'" placeholder="ملاحظة البند (فارق؟)" style="font-size:11px;padding:5px 8px;margin-top:4px"></div>'; }
function noteLine(t){ return t?'<div class="mini" style="color:#d98a00">📝 '+esc(t)+'</div>':''; }

// ---- بدء ----
buildTabs();
if(KEY||TOKEN){ showApp(); } else { needLogin(); }
</script>
</body>
</html>
