<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Fancy Sense — المحاسبة</title>
<style>
:root{--bg:#0f1720;--panel:#16212e;--panel2:#1c2a3a;--line:#2a3a4d;--txt:#e7eef6;--muted:#93a3b5;--accent:#e0218a;--accent2:#ff5db1;--green:#0e9d6a;--red:#e5484d;--amber:#d98a00;--brand:#c9b037;--radius:12px}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
a{color:var(--accent2)}
.hidden{display:none!important}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(90deg,#1b2a3a,#16212e);border-bottom:2px solid var(--accent);position:sticky;top:0;z-index:30;flex-wrap:wrap}
.brand{font-weight:900;font-size:19px;letter-spacing:1px}
.brand span{color:var(--accent2)}
.brand small{display:block;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:2px}
.topbar .sp{flex:1}
.btn{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:8px 15px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
.btn.green{background:var(--green)}
.btn.red{background:var(--red)}
.btn.sm{padding:3px 10px;font-size:11px;border-radius:7px}
.tabs{display:flex;gap:4px;padding:8px 12px;background:var(--panel);overflow-x:auto;border-bottom:1px solid var(--line);position:sticky;top:51px;z-index:20}
.tab{white-space:nowrap;padding:8px 14px;border-radius:9px 9px 0 0;cursor:pointer;color:var(--muted);font-weight:700;font-size:13px;border:1px solid transparent}
.tab.on{color:#fff;background:var(--panel2);border-color:var(--line);border-bottom-color:var(--panel2)}
.wrap{max-width:1300px;margin:0 auto;padding:16px}
.page{display:none}
.page.on{display:block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px}
.panel h3{margin:0 0 10px;font-size:15px;border-right:4px solid var(--accent);padding-right:9px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld.full{grid-column:1/-1}
.fld label{font-size:12px;color:var(--muted);font-weight:600}
.fld input,.fld select,.fld textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--txt);font-size:13px;font-family:inherit}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.kpi .ttl{font-size:11px;color:var(--muted);font-weight:600}
.kpi .val{font-size:20px;font-weight:800;margin-top:4px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap}
th,td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:right}
th{background:var(--panel2);color:var(--muted);font-weight:700;position:sticky;top:0}
tbody tr:hover{background:rgba(224,33,138,.06)}
.num{font-variant-numeric:tabular-nums}
.pos{color:#2fd196}.neg{color:#ff6b7a}.mut{color:var(--muted)}
.pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}
.pill.g{background:rgba(14,157,106,.18);color:#2fd196}
.pill.r{background:rgba(229,72,77,.18);color:#ff6b7a}
.msg{font-size:12px;min-height:16px;margin:6px 0}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center}
.gate .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 26px;width:320px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-size:12px}
.chip button{background:none;border:none;color:var(--red);cursor:pointer;font-size:13px;padding:0;line-height:1}
.sub{font-size:11.5px;color:var(--muted)}
.mini{font-size:10px;color:var(--muted)}
</style>
</head>
<body>

<!-- بوابة بسيطة -->
<div id="gate" class="gate">
  <div class="card">
    <div class="brand" style="font-size:24px">FANCY<span> SENSE</span><small>المحاسبة</small></div>
    <p class="sub" style="margin:14px 0 10px">الدخول موحّد مع نظام العز الدولية — سجّلي الدخول هناك ثم افتحي فانسي سنس.</p>
    <a href="accounting.html" class="btn" style="width:100%;display:block;text-decoration:none;box-sizing:border-box">🔑 الدخول عبر نظام العز</a>
    <div id="gate-msg" class="msg" style="color:var(--amber);margin-top:10px"></div>
  </div>
</div>

<!-- التطبيق -->
<div id="app" class="hidden">
<div class="topbar">
  <div class="brand">FANCY<span> SENSE</span><small>نظام المحاسبة — اكسسوارات وعدسات</small></div>
  <div class="sp"></div>
  <span id="hdr-info" class="sub"></span>
  <button class="btn ghost sm" onclick="loadAll()">🔄 تحديث</button>
  <a href="accounting.html" class="btn ghost sm" style="text-decoration:none">← العز الدولية</a>
</div>
<div class="tabs" id="tabs"></div>
<div class="wrap">
  <div class="page on" id="p-dash"></div>
  <div class="page" id="p-sales"></div>
  <div class="page" id="p-machine"></div>
  <div class="page" id="p-expenses"></div>
  <div class="page" id="p-rewa"></div>
  <div class="page" id="p-match"></div>
  <div class="page" id="p-credit"></div>
  <div class="page" id="p-ajel"></div>
  <div class="page" id="p-xfer"></div>
  <div class="page" id="p-banks"></div>
  <div class="page" id="p-inv"></div>
  <div class="page" id="p-settings"></div>
  <div class="page" id="p-reqs"></div>
</div>
</div>

<script>
// 🔐 نفس دخول نظام العز (نفس النطاق → localStorage مشترك): لا مفتاح مضمّن
const FN='https://ofotvacszlmrqxzfjmtn.supabase.co/functions/v1/fs-dashboard';
let KEY=localStorage.getItem('acc_key')||'', TOKEN=localStorage.getItem('acc_token')||'', DATA=null;

// ---- أدوات ----
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=v=>{const x=Number(v);return isNaN(x)?0:x;};
const fmt=v=>n(v).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:3});
const today=()=>new Date().toISOString().slice(0,10);
const cur=()=>(DATA&&DATA.config&&DATA.config.currency)||'OMR';
const taxRate=()=>n((DATA&&DATA.config&&DATA.config.tax_rate)||0);
function listVals(cat){return (DATA&&DATA.lists||[]).filter(l=>l.category===cat).map(l=>l.value);}
function opts(cat,sel){return '<option value="">—</option>'+listVals(cat).map(v=>'<option'+(v===sel?' selected':'')+'>'+esc(v)+'</option>').join('');}

async function api(method,action,payload){
  const opt={method,cache:'no-store',headers:{}};
  if(KEY)opt.headers['x-acc-key']=KEY; if(TOKEN)opt.headers['x-acc-token']=TOKEN;
  if(method==='POST'){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify({action,payload});}
  const qs='?_t='+Date.now()+(KEY?('&key='+encodeURIComponent(KEY)):'')+(TOKEN?('&token='+encodeURIComponent(TOKEN)):'');
  const r=await fetch(FN+qs,opt);
  if(r.status===401){ needLogin(); throw new Error('انتهت الجلسة — سجّلي الدخول من نظام العز'); }
  return r.json();
}
async function loadAll(){
  try{ DATA=await api('GET'); if(DATA.error){alert('خطأ: '+DATA.error);return;} render(); }
  catch(e){ /* 401 يعالَج في api */ }
}
function needLogin(){ $('app').classList.add('hidden'); $('gate').classList.remove('hidden'); $('gate-msg').innerHTML='لازم تسجّلي الدخول من <b>نظام العز</b> أولاً (نفس الجلسة).'; }
async function crud(action,table,data,id,reason){
  try{
    const j=await api('POST',action,{table,data,id,reason});
    if(j&&j.error){ toast('⚠️ خطأ: '+j.error,true); return false; }
    if(j&&j.pending){ toast(j.dup?'ℹ️ فيه طلب معلّق لنفس السطر — بانتظار موافقة المالكة':'📨 أُرسل الطلب للمالكة — ما يتغيّر شي قبل موافقتها'); return true; }
    await loadAll(); toast('✅ تم الحفظ'); return true;
  }catch(e){ toast('⚠️ تعذّر الحفظ: '+(e&&e.message||e),true); return false; }
}
function toast(msg,err){ let t=$('fs-toast'); if(!t){ t=document.createElement('div'); t.id='fs-toast'; t.style.cssText='position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:11px 20px;border-radius:10px;font-weight:700;font-size:14px;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,.4)'; document.body.appendChild(t); }
  t.style.background=err?'#e5484d':'#0e9d6a'; t.style.color='#fff'; t.textContent=msg; t.style.display='block'; clearTimeout(window._fsTT); window._fsTT=setTimeout(()=>{t.style.display='none';},err?5000:2200); }

// ---- البوابة (موحّدة مع نظام العز) ----
function showApp(){ $('gate').classList.add('hidden'); $('app').classList.remove('hidden'); loadAll(); }

// ---- التبويبات ----
const TABS=[['dash','📊 لوحة'],['sales','🧾 المبيعات اليومية'],['machine','🏧 متابعة المكنة'],['expenses','💸 مصاريف يومية'],['rewa','🔄 مطابقة REWA'],['match','🔗 مطابقة بنوك العز'],['credit','👤 عملاء الآجل'],['ajel','📒 إيداعات الآجل'],['xfer','🔄 التحويلات البنكية'],['banks','🏦 البنوك والإيداعات'],['inv','📦 منتجات ناقصة'],['settings','⚙️ إعدادات'],['reqs','🔔 طلبات الموافقة']];
function buildTabs(){ $('tabs').innerHTML=TABS.map((t,i)=>'<div class="tab'+(i===0?' on':'')+'" data-p="'+t[0]+'"'+(t[0]==='reqs'?' style="display:none"':'')+' onclick="switchTab(this)">'+t[1]+'</div>').join(''); }
function switchTab(el){ document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on')); el.classList.add('on'); const p=el.dataset.p; document.querySelectorAll('.page').forEach(pg=>pg.classList.remove('on')); $('p-'+p).classList.add('on'); }

// ---- فورم قابل للطيّ ----
function formToggle(id){ const f=$(id); if(f)f.classList.toggle('hidden'); }

const FS_VER='v75';
function render(){
  $('hdr-info').textContent=(DATA.config.company||'Fancy Sense')+' · '+cur()+' · ضريبة '+taxRate()+'% · '+FS_VER;
  renderDash(); renderSales(); renderMachine(); renderExpenses(); renderRewa(); renderMatch(); renderCredit(); renderAjel(); renderXfer(); renderBanks(); renderInv(); renderSettings(); renderReqs();
}

// ===== 🔗 مطابقة بنوك العز (للعرض فقط) =====
function renderMatch(){
  const C=cur();
  const F={from:window._mFrom||'',to:window._mTo||''};
  const statusF=window._mStatus||'all';   // all | matched | unmatched
  const inr=(d)=>{ d=String(d||'').slice(0,10); if(F.from&&d<F.from)return false; if(F.to&&d>F.to)return false; return true; };
  // المكنة تنزل البنك باليوم التالي → نرجّع تاريخ مكنة البنك يوماً للخلف ليطابق يوم المبيعة في فانسي
  const shiftDay=(ds,k)=>{ ds=String(ds||'').slice(0,10); const p=ds.split('-'); if(p.length<3)return ds; const dt=new Date(Date.UTC(+p[0],+p[1]-1,+p[2])); if(isNaN(dt))return ds; dt.setUTCDate(dt.getUTCDate()+k); return dt.toISOString().slice(0,10); };
  // قوننة اسم الفرع (يوحّد مسمّيات فانسي والعز) → كيوسك / شوب / عمان / غير محدّد
  const brCanon=(s)=>{ s=String(s||''); if(/معرض|معارض/.test(s))return 'معارض'; if(/kiosk|كيوسك/i.test(s))return 'كيوسك'; if(/shop|شوب|store|محل/i.test(s))return 'شوب'; if(/salah|صلال/i.test(s)||/عمان(?![يى])/.test(s)||/(^|[^a-z])oman([^a-z]|$)/i.test(s))return 'عمان'; return 'غير محدّد'; };   /* معارض نشاط منفصل · «عمانى» جنسية ليست فرع عمان */
  // تصنيف حركة العز من حقل التفصيل → {الفرع, النوع, المبلغ}؛ تُستبعد صفوف التجربة
  const azClass=(x)=>{ if(/^\s*test\s*$/i.test(String(x.details||'')))return null; const t=[x.details,x.description,x.more_details].map(v=>String(v||'')).join(' '); const out=n(x.out_raw),inc=n(x.in_raw); let type; if(out>0)type='مصروفات'; else if(/اجل|آجل/.test(t))type='آجل'; else if(/صندوق/.test(t))type='صندوق'; else if(/تحويل/.test(t))type='تحويل'; else type='مكنة'; return {branch:brCanon(t),type:type,amount:out>0?out:inc}; };
  const TYPES=['مكنة','صندوق','تحويل','آجل'];   // المصروفات محذوفة من المقارنة (لا داعي لمقارنتها)
  const TI={'مكنة':'🏧','صندوق':'📥','تحويل':'🔄','آجل':'📒','مصروفات':'💸'};
  const BR=['كيوسك','شوب','عمان','معارض','غير محدّد'];
  const matchable=(br)=>br==='كيوسك'||br==='شوب'||br==='عمان';
  // تجميع: fsM[date][branch][type] و azM[date][branch][type]
  const fsM={},azM={},azMachDate={};   // azMachDate[يوم المبيعة] = {تاريخ دخول البنك الفعلي: المبلغ} — عرض فقط لتوثيق ترحيل المكنة
  const add=(M,d,br,t,v)=>{ if(!d)return; M[d]=M[d]||{}; M[d][br]=M[d][br]||{}; M[d][br][t]=(M[d][br][t]||0)+n(v); };
  (DATA.daily_sales||[]).forEach(x=>{ const d=String(x.sale_date||'').slice(0,10); if(!inr(d))return; const br=brCanon(x.branch); add(fsM,d,br,'مكنة',x.machine); let tr=n(x.bank_transfer); if(!tr&&Array.isArray(x.transfers))tr=x.transfers.reduce((a,t)=>a+n(t&&t.amount),0); add(fsM,d,br,'تحويل',tr); });
  (DATA.atm_deposit||[]).forEach(x=>{ const d=String(x.dep_date||'').slice(0,10); if(!inr(d))return; add(fsM,d,brCanon(x.branch),'صندوق',x.amount); });
  (DATA.expenses||[]).forEach(x=>{ const d=String(x.exp_date||'').slice(0,10); if(!inr(d))return; add(fsM,d,brCanon(x.branch),'مصروفات',x.amount); });
  // 📒 الآجل = المُحصَّل الفعلي (credit_txn.paid) — حركة بنكية على مستوى الشركة (بلا فرع) → «غير محدّد»؛ البيع الآجل اليومي ليس حركة بنكية فلا يُدرَج
  (DATA.credit_txn||[]).forEach(x=>{ const d=String(x.txn_date||'').slice(0,10); if(!inr(d))return; add(fsM,d,'غير محدّد','آجل',x.paid_amount); });
  (DATA.acc_fancy||[]).forEach(x=>{ const c=azClass(x); if(!c)return; const orig=String(x.tx_date||'').slice(0,10); let d=orig; if(c.type==='مكنة')d=shiftDay(d,-1);   /* مكنة البنك تنزل باليوم التالي → ترجيع يوم */ if(!inr(d))return; add(azM,d,c.branch,c.type,c.amount); if(c.type==='مكنة'){ azMachDate[d]=azMachDate[d]||{}; azMachDate[d][orig]=(azMachDate[d][orig]||0)+n(c.amount); } });
  // 🔄 تفاصيل الحوالات البنكية لكل تاريخ (فانسي + تقرير البنك) — تظهر تحت إجمالي التحويل
  const fsTr={},azTr={};
  (DATA.daily_sales||[]).forEach(x=>{ const d=String(x.sale_date||'').slice(0,10); if(!inr(d))return; const br=brCanon(x.branch);
    if(Array.isArray(x.transfers)&&x.transfers.length){ x.transfers.forEach(t=>{ const a=n(t&&t.amount); if(a)(fsTr[d]=fsTr[d]||[]).push({amount:a,bank:(t&&(t.bank||t.bank_name))||'',branch:br}); }); }
    else { const a=n(x.bank_transfer); if(a)(fsTr[d]=fsTr[d]||[]).push({amount:a,bank:'',branch:br}); } });
  (DATA.acc_fancy||[]).forEach(x=>{ const d=String(x.tx_date||'').slice(0,10); if(!inr(d))return; const c=azClass(x); if(!c||c.type!=='تحويل')return; (azTr[d]=azTr[d]||[]).push({amount:c.amount,bank:x.bank_name||'',ref:x.bank_ref||''}); });
  const get=(M,d,br,t)=>(((M[d]||{})[br]||{})[t])||0;
  const dates=[...new Set([...Object.keys(fsM),...Object.keys(azM)])].sort().reverse();
  const grandF={},grandA={}; TYPES.forEach(t=>{grandF[t]=0;grandA[t]=0;});
  // كشف مختصر لكل يوم (تاريخ · فرق الوارد · الحالة) يتوسّع للتفاصيل عند الضغط
  const INFLOW=['مكنة','صندوق','تحويل','آجل'];   // الوارد للبنك؛ المصروفات مستثناة من حساب الفرق والحالة
  const detHead='<tr style="font-size:11px;color:var(--muted)"><th style="text-align:right">الفرع</th>'+TYPES.map(t=>'<th>'+TI[t]+' '+t+'</th>').join('')+'<th>إجمالي</th></tr>';
  const rows_html=[], dailyExp=[];
  dates.forEach((d,di)=>{
    const brs=BR.filter(br=> (fsM[d]&&fsM[d][br]) || (azM[d]&&azM[d][br]) );
    const cv=(v)=>(Math.abs(v)>=0.005?fmt(v):'<span class="mut">·</span>');   // قيمة أو نقطة
    // تجميع الملخّص العام
    TYPES.forEach(t=>{ grandF[t]+=brs.reduce((a,br)=>a+get(fsM,d,br,t),0); grandA[t]+=brs.reduce((a,br)=>a+get(azM,d,br,t),0); });
    // ===== قسم أ: مجمّع — كل الفروع (المكنة + الآجل) — البنك يجمّعها بلا فرع =====
    const AGG=['مكنة','آجل'];
    const aggRows=AGG.map(t=>{ const f=brs.reduce((a,br)=>a+get(fsM,d,br,t),0), a=brs.reduce((s,br)=>s+get(azM,d,br,t),0), dv=f-a, hd=Math.abs(dv)>=0.005;
      // 💳 نسبة العمولة = ما أخذه البنك ÷ فانسي (المكنة تاخذ عمولة فيطلع البنك أقل)
      const pct = f>0.005 ? (dv/f*100) : null;
      const pctCell = (pct==null)?'<span class="mut">—</span>':('<span style="color:'+(pct>0?'#e0a83a':(pct<-0.01?'#ff6b7a':'#2fd196'))+';font-weight:700">'+pct.toFixed(2)+'%</span>');
      // 📅 تاريخ دخول المكنة الفعلي بالبنك (عرض فقط) — يُكتب تحت مبلغ البنك ليتأكّد أن مكنة اليوم طابقت دخول اليوم التالي
      let bankCell=cv(a);
      if(t==='مكنة'&&a>0.005&&azMachDate[d]){ const dm=(s)=>{const p=String(s).split('-');return p.length>=3?p[2]+'/'+p[1]:s;}; const lbl=Object.keys(azMachDate[d]).sort().map(dm).join('، '); bankCell+='<div style="font-size:9px;color:var(--muted);font-weight:600;margin-top:2px">📅 دخل البنك '+lbl+'</div>'; }
      return '<tr><td style="font-weight:700">'+TI[t]+' '+t+'</td><td class="num">'+cv(f)+'</td><td class="num" style="color:#3aa0ff">'+bankCell+'</td><td class="num" style="font-weight:800;color:'+(hd?'#ff6b7a':'#2fd196')+(hd?';background:rgba(229,72,77,.08)':'')+'">'+(hd?fmt(dv):'✓')+'</td><td class="num">'+pctCell+'</td></tr>'; }).join('');

// • من ١/١/٢٠٢٦: «دخل البنك» من إيداعات نظام العز فقط (لا الشيت). قبلها: الشيت (العز ما فيه بيانات ٢٠٢٥).

//   قيود العز القديمة (لين يونيو ٢٠٢٦) مؤرّخة بيوم المبيعات ومرجعها «F - ddmmyy» → تُنسب لذاك اليوم مباشرة (t.sale).

// الحالة: ok / pending (كشف اليوم التالي ما وصل) / lost (ما دخل شي)
function mcRecon(S,M,txns,maxBank,sh){
  const AZ_FROM='2026-01-01';
  const days=Object.keys(S).filter(d=>S[d]>0.005).sort();
  const B={},src={},note={},bdate={},items=[];
  days.forEach(d=>{ if(d<AZ_FROM&&(d in M)){B[d]=M[d];src[d]='fs';items.push({d,amt:M[d],date:'',ref:'',tbl:'الشيت (Deposted in Bank)',bank:'',label:''});} });   // قبل ٢٠٢٦: الشيت
  txns.forEach(t=>{ if(!(t.amt>0.005))return; const d=t.sale||sh(t.date,-1); if(d<AZ_FROM)return;
    B[d]=(B[d]||0)+t.amt; src[d]='az'; items.push({d,amt:t.amt,date:t.date,ref:t.ref||'',tbl:t.tbl||'',bank:t.bank||'',label:t.label||''}); if(!t.sale)bdate[d]=t.date; else note[d]=note[d]||('قيد العز '+t.ref);
    if(!(S[d]>0.005)) note[d]='إيداع بلا مبيعات باليوم السابق';
  });
  const status={}; Object.keys({...S,...B}).forEach(d=>{ if(!(S[d]>0.005)){status[d]='ok';return;} status[d]=(B[d]>0.005)?'ok':(sh(d,1)>maxBank?'pending':'lost'); });
  return {B,src,note,status,bdate,items};
}

function slDiff(){
  const ch=[['sl-machine','sl-rmachine','d-machine'],['sl-cash','sl-rcash','d-cash']];
  let te=0,tr=0;
  ch.forEach(c=>{ const e=n(($(c[0])||{}).value), r=n(($(c[1])||{}).value); te+=e; tr+=r; const d=e-r; const el=$(c[2]); if(el){ el.textContent=fmt(d); el.style.color=Math.abs(d)<0.005?'#2fd196':'#ff6b7a'; } });
  // الآجل (مجموع أسطر العملاء) مقابل REWA
  let crAmt=0; document.querySelectorAll('#sl-credit-rows .sl-cr-row').forEach(row=>{ const i=row.dataset.i; crAmt+=n(($('cr-amt-'+i)||{}).value); });

  const rcr=n(($('sl-rcredit')||{}).value); const dcr=crAmt-rcr; const dce=$('d-credit'); if(dce){ dce.textContent=fmt(dcr); dce.style.color=Math.abs(dcr)<0.005?'#2fd196':'#ff6b7a'; }
  te+=crAmt; tr+=rcr;
  // التحويلات البنكية (مجموع الأسطر) مقابل REWA
  let trAmt=0; document.querySelectorAll('#sl-transfer-rows .sl-tr-row').forEach(row=>{ const i=row.dataset.i; trAmt+=n(($('tr-amt-'+i)||{}).value); });
  if($('sl-transfer'))$('sl-transfer').value=+trAmt.toFixed(3);
  if($('sl-transfer-d'))$('sl-transfer-d').textContent=fmt(trAmt);
  const rtr=n(($('sl-rtransfer')||{}).value); const dtr=trAmt-rtr; const dte=$('d-transfer'); if(dte){ dte.textContent=fmt(dtr); dte.style.color=Math.abs(dtr)<0.005?'#2fd196':'#ff6b7a'; }
  te+=trAmt; tr+=rtr;
  if($('sl-total'))$('sl-total').value=+te.toFixed(3);
  if($('sl-rtotal'))$('sl-rtotal').value=+tr.toFixed(3);
  if($('sl-total-d'))$('sl-total-d').textContent=fmt(te);
  if($('sl-rtotal-d'))$('sl-rtotal-d').textContent=fmt(tr);
  const gd=te-tr; const g=$('sl-tdiff'); if(g){ g.textContent=fmt(gd); g.style.color=Math.abs(gd)<0.005?'#2fd196':'#ff6b7a'; }
}

// ===== 🏦 البنوك والإيداعات =====
// 🏦 إيداعات الصناديق الفعلية من نظام العز (كل إيداع لحاله، مثل ما هو بالبنك) — كل شي «فانسي» داخل للبنك ما عدا المكنة (بنك ظفار) والآجل والتحويل البنكي (مبيعات بالتحويل = حساب منفصل)
function _cbBranch(t){ t=String(t||''); if(/كيوسك|kiosk/i.test(t))return 'Kiosk (Gardens mall)'; if(/محل|شوب|shop|store/i.test(t))return 'Shop (Gardens mall)'; if(/معرض|معارض/.test(t))return 'معارض'; if(/عمان|oman|صلال|salalah/i.test(t))return 'OMAN'; return 'غير محدّد'; }
function _cbAzRows(){
  const out=[], txt=x=>[x.details,x.description,x.more_details].map(v=>String(v||'')).join(' ');
  (DATA.acc_fancy||[]).forEach(x=>{ const a=n(x.in_raw); if(!(a>0)||n(x.out_raw)>0)return; const t=txt(x), bk=String(x.bank_name||''); if(/^\s*test\s*$/i.test(String(x.details||'')))return;
    if(/dhofar|ظفار/i.test(bk)&&!/صندوق|تحويل/.test(t))return;   // مكنة
    if(/آجل|اجل/.test(t))return;                                   // تحصيل عملاء آجل
    const lbl=(String(x.more_details||'').trim()||String(x.details||'').trim());
    out.push({d:String(x.tx_date||'').slice(0,10),a,bank:bk,label:lbl,ref:String(x.bank_ref||'').trim(),br:_cbBranch(lbl+' '+t),kind:/تحويل/.test(t)?'تحويل بنكي':'صندوق',src:'الصندوق والبنوك'}); });
  (DATA.acc_fancy_btx||[]).forEach(x=>{ const a=n(x.amount_in), d=String(x.tx_date||'').slice(0,10), t=String(x.note||''), bk=String(x.bank_name||''); if(!(a>0)||!d)return;
    if(/dhofar|ظفار/i.test(bk)&&!/صندوق|تحويل/.test(t))return; if(/آجل|اجل/.test(t))return;
    if(out.some(o=>Math.abs(o.a-a)<0.011&&Math.abs(Date.parse(o.d)-Date.parse(d))<=2*864e5))return;   // نفس الإيداع بالجدولين
    const lbl=t.replace(/^🏷️\s*/,'').split('←').map(z=>z.trim()).filter(Boolean).pop()||t;
    out.push({d,a,bank:bk,label:lbl,ref:String(x.bank_ref||'').trim(),br:_cbBranch(t),kind:/تحويل/.test(t)?'تحويل بنكي':'صندوق',src:'كشف البنك'}); });
  return out.sort((p,q)=>p.d<q.d?-1:1);
}
// مقارنة: إيداعات المحاسبة (atm_deposit) ↔ إيداعات العز الفعلية (v71):
//  ١) مبلغ واحد مطابق (تاريخ العز −٣..+٧، يفضّل نفس الفرع)
//  ٢) المبلغ دخل البنك على أكثر من جزء (٢–٤ حركات لنفس الفرع مجموعها = مبلغ المحاسبة)
//  ٣) وإلا: حركات نفس الفرع بأقرب يوم (٠..+٣) تظهر كأجزاء مع الفرق
function _cbStOf(r){ if(!r.acc)return 'az'; if(!r.azs.length)return 'acc'; return Math.abs(r.azT-r.acc.a)<0.011?'ok':'part'; }
function _cbCompare(){
  const Z=_cbAzRows(), used=new Set(), gap=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/864e5);
  const A=(DATA.atm_deposit||[]).map(x=>({id:x.id,d:String(x.dep_date||'').slice(0,10),a:n(x.amount),br:x.branch||'—',bank:x.bank||'',note:x.note||''})).sort((p,q)=>p.d<q.d?-1:1);
  const M=A.map(()=>null);

      '<div class="tbl-wrap"><table style="font-size:12px;margin:6px 0"><thead><tr><th>الخانة</th><th>القيمة الحالية</th><th>'+(isDel?'':'القيمة الجديدة')+'</th></tr></thead><tbody>'+(diff||'<tr><td colspan="3" class="mut">—</td></tr>')+'</tbody></table></div>'+
      (r.status==='pending'?'<button class="btn green" onclick="fsResolve('+r.id+',\'approve\')">✅ موافقة وتطبيق</button> <button class="btn red" onclick="fsResolve('+r.id+',\'reject\')">❌ رفض</button>':'<div class="mini mut">'+esc(r.result||'')+'</div>')+'</div>'; };
  el.innerHTML='<div class="panel" style="border:1px solid #e0a83a"><h3 style="margin:0 0 6px">🔔 طلبات الموافقة</h3><div class="sub">تعديلات وحذوفات المحاسبين (محمد وآية). <b>ما ينطبق أي شي على البيانات إلا بعد موافقتك.</b> هذا التبويب يظهر لك فقط.</div></div>'+
    (pend.length?pend.map(card).join(''):'<div class="panel mut" style="text-align:center">✓ لا توجد طلبات معلّقة</div>')+
    (done.length?'<div class="panel"><h3 style="margin:0">🗂️ آخر الطلبات المحسومة</h3></div>'+done.map(card).join(''):'');
}
async function fsResolve(id,decision){
  if(!confirm(decision==='approve'?'اعتماد الطلب وتطبيقه على البيانات؟':'رفض الطلب؟ تبقى البيانات كما هي.'))return;
  try{ const j=await api('POST','resolve_request',{id,decision}); if(j&&j.error){ toast('⚠️ '+j.error,true); return; } await loadAll(); toast(decision==='approve'?'✅ '+(j.result||'طُبّق'):'❌ رُفض الطلب — بلا تغيير'); }catch(e){ toast('⚠️ '+(e&&e.message||e),true); }
}


// ---- مولّدات حقول ----
function fin(label,id,type,val,extra){ return '<div class="fld"><label>'+label+'</label><input id="'+id+'" type="'+type+'"'+(val!=null&&val!==''?' value="'+esc(val)+'"':(type==='number'?' value="0"':''))+' '+(extra||'')+'></div>'; }
function fsel(label,id,cat){ return '<div class="fld"><label>'+label+'</label><select id="'+id+'">'+opts(cat)+'</select></div>'; }
// بند بمبلغ + ملاحظة تحته (لإظهار الفارق لكل بند)
function fch(label,idAmt,idNote){ return '<div class="fld"><label>'+label+'</label><input id="'+idAmt+'" type="number" value="0" oninput="slTotal()"><input id="'+idNote+'" placeholder="ملاحظة البند (فارق؟)" style="font-size:11px;padding:5px 8px;margin-top:4px"></div>'; }
function noteLine(t){ return t?'<div class="mini" style="color:#d98a00">📝 '+esc(t)+'</div>':''; }

// ---- بدء ----
buildTabs();
if(KEY||TOKEN){ showApp(); } else { needLogin(); }
</script>
</body>
