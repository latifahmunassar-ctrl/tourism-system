<!--
  ============= إعداد واحد فقط: رابط تقييم جوجل =============
  Google Business Profile ← «اطلب تقييمات» ← انسخي الرابط
  (مثال: https://g.page/r/........./review)
  بدّلي القيمة تحت ثم احفظي وارفعي.
  =========================================================

<script> var GOOGLE_REVIEW_URL = "PUT_GOOGLE_REVIEW_LINK_HERE"; </script>
<style>
  :root{
    --gold:#c79a3a; --gold2:#eac26a; --goldDeep:#a67c1b;
    --deep:#0d4f4a; --deep2:#0a3a36; --ink:#173d39; --muted:#7c8b89; --card:#fffdf8;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"Tajawal",system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(circle at 20% 10%, rgba(234,194,106,.18), transparent 42%),
      radial-gradient(circle at 85% 90%, rgba(234,194,106,.14), transparent 40%),
      linear-gradient(160deg,#0d4f4a 0%,#0a3a36 58%,#062824 100%);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:26px 18px; color:var(--ink);
  }
  .card{
    width:100%; max-width:430px; background:var(--card); border-radius:30px;
    padding:38px 28px 30px; text-align:center; position:relative; overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.42), 0 2px 0 rgba(255,255,255,.6) inset;
    animation:rise .6s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{from{opacity:0; transform:translateY(18px) scale(.98)} to{opacity:1; transform:none}}
  .card::before{content:""; position:absolute; inset:0 0 auto 0; height:7px;
    background:linear-gradient(90deg,var(--goldDeep),var(--gold2),var(--goldDeep));}
  .card::after{content:""; position:absolute; width:220px; height:220px; border-radius:50%;
    background:radial-gradient(circle, rgba(234,194,106,.12), transparent 70%);
    top:-70px; left:-60px; pointer-events:none;}
  .logo{width:140px; height:auto; margin:8px auto 18px; display:block; position:relative;}
  h1{font-size:24px; color:var(--deep); font-weight:900; margin-bottom:10px; line-height:1.5;
     letter-spacing:.2px;}
  h1 .em{font-size:26px;}
  .sub{font-size:15.5px; color:var(--muted); margin-bottom:30px; line-height:1.8; font-weight:500;}
  .stars{display:flex; flex-direction:row-reverse; justify-content:center; gap:10px; margin-bottom:14px;}
  .star{
    font-size:52px; line-height:1; cursor:pointer; user-select:none;
    color:transparent; background:linear-gradient(180deg,#e7ebea,#dfe4e2);
    -webkit-background-clip:text; background-clip:text;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.06));
    transition:transform .14s cubic-bezier(.2,.9,.3,1.4), filter .15s ease;
    animation:idle 2.6s ease-in-out infinite; animation-delay:calc(var(--i) * .12s);
  }
  @keyframes idle{0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)}}
  .star:hover{transform:scale(1.18) translateY(-2px);}
  .star:active{transform:scale(.9);}
  .star.on{
    color:transparent; background:linear-gradient(180deg,var(--gold2),var(--gold));
    -webkit-background-clip:text; background-clip:text;
    filter:drop-shadow(0 4px 12px rgba(199,154,58,.55));
    animation:pop .3s ease;
  }
  @keyframes pop{0%{transform:scale(.8)} 60%{transform:scale(1.22)} 100%{transform:scale(1)}}
  .hint{font-size:13.5px; color:#a7b4b1; font-weight:500; margin-top:6px;}
  .thanks{display:none; padding:10px 0 4px;}
  .thanks .big{font-size:52px; margin-bottom:12px; animation:pop .5s ease;}
  .thanks h2{font-size:22px; color:var(--deep); font-weight:900; margin-bottom:8px;}
  .thanks p{font-size:14.5px; color:var(--muted); line-height:1.8;}
  .spin{width:28px;height:28px;border:3px solid #eee;border-top-color:var(--gold);
    border-radius:50%; margin:16px auto 0; animation:sp .8s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg)}}
  .foot{margin-top:24px; font-size:12.5px; color:#c3ccca; font-weight:500; position:relative;}
  .foot b{color:var(--goldDeep); font-weight:800;}
  .warn{margin-top:16px; font-size:12.5px; color:#c0392b; background:#fdecea;
    border:1px solid #f5c6cb; border-radius:12px; padding:9px 11px; display:none;}
</style>

<script>
(function(){
  var stars=[].slice.call(document.querySelectorAll(".star"));
  function paint(v){ stars.forEach(function(s){ s.classList.toggle("on",(+s.dataset.v)<=v); }); }
  stars.forEach(function(s){
    var v=+s.dataset.v;
    s.addEventListener("mouseenter",function(){ paint(v); });
    s.addEventListener("mouseleave",function(){ if(!s._locked) paint(0); });
    s.addEventListener("click",function(){ choose(v); });
  });
  function choose(v){
    paint(v); stars.forEach(function(s){ s._locked=true; });
    if(!GOOGLE_REVIEW_URL || GOOGLE_REVIEW_URL.indexOf("PUT_GOOGLE")===0){
      document.getElementById("warn").style.display="block"; return;
    }
    document.getElementById("rate").style.display="none";
    document.getElementById("thanks").style.display="block";
    setTimeout(function(){ window.location.href=GOOGLE_REVIEW_URL; }, 950);
  }
})();
