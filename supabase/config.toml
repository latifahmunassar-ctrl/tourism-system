# Twilio sends WhatsApp webhooks WITHOUT an Authorization header.
# Without this flag every Twilio POST gets bounced with 401
# UNAUTHORIZED_NO_AUTH_HEADER before our code even runs.
# The function does its own auth gating internally on admin_action
# endpoints (checkAuth / checkAuthOrSession) so disabling JWT
# verification at the platform layer is safe.
[functions.WhatsApp-Router]
verify_jwt = false

# Public B2B intake form posts here with no auth header. The function gates its
# admin actions internally on CLIENT_ADMIN_SECRET; the public submit path only
# ever writes a request + returns a ref number (never reads pricing).
[functions.client-intake]
verify_jwt = false

# Public proposal page fetches the sanitized client view by unguessable token,
# with no auth header. Only returns data for status='sent' requests.
[functions.client-proposal]
verify_jwt = false

# WhatsApp group bridge posts raw group messages here with no auth header.
# The function gates every request internally on the x-intake-secret header
# (INTAKE_SECRET), so disabling platform JWT verification is safe.
[functions.group-intake]
verify_jwt = false

# Passkey (WebAuthn) endpoint. Called from the dashboard with no guaranteed
# JWT; every action is gated internally by cryptographic challenge + credential
# verification (+ device approval for staff), so platform JWT check is unneeded.
[functions.webauthn]
verify_jwt = false

# Meta (Instagram) sends webhook events WITHOUT a JWT. The function verifies the
# GET subscription via IG_VERIFY_TOKEN and only writes inbound messages via
# service role, so disabling platform JWT verification is required and safe.
[functions.instagram-webhook]
verify_jwt = false
