<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام البرامج السياحية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
--bg:#0F1923; --s1:#162030; --s2:#1C2B3A; --s3:#243347;
--border:rgba(255,255,255,0.07);
--gold:#D4A843; --gold2:#F0C96A;
--teal:#2A9D8F; --text:#E8EDF2; --muted:rgba(232,237,242,0.42);
--r:12px;
--blue1:#1a3a8f; --blue2:#0d2060; --blue3:#2952c4;
.quick-chips {
padding:10px 16px; display:flex; gap:7px; flex-wrap:wrap;
border-top:1px solid var(–border);
}
.qchip {
padding:5px 12px; border-radius:16px; font-size:11px; font-weight:700;
border:1px solid var(–border); background:transparent;
color:var(–muted); cursor:pointer; font-family:‘Tajawal’,sans-serif;
transition:all 0.2s; white-space:nowrap;
}
.qchip:hover { border-color:var(–gold); color:var(–gold); background:rgba(212,168,67,0.07); }

.ebtn-copy { background:var(–s2); color:var(–muted); border:1px solid var(–border); }
.ebtn-copy:hover { color:var(–text); border-color:rgba(255,255,255,0.2); }
.ebtn-pdf {
background:linear-gradient(135deg,var(–gold),var(–gold2));
color:#0F1923; font-weight:800;
}
.ebtn-pdf:hover { transform:translateY(-1px); box-shadow:0 4px 14px rgba(212,168,67,0.3); }
.ebtn-pdf-nologo {
background:var(–s2); color:var(–muted); border:1px solid var(–border);
}
.ebtn-pdf-nologo:hover { color:var(–text); border-color:rgba(255,255,255,0.2); }

.quote-wrap { flex:1; overflow-y:auto; padding:20px; }
.quote-wrap::-webkit-scrollbar { width:4px; }
.quote-wrap::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.08); border-radius:2px; }

.empty-output {
flex:1; display:flex; flex-direction:column;
align-items:center; justify-content:center;
gap:14px; opacity:0.35; padding:40px;
}
.empty-output-icon { font-size:56px; }
.empty-output-title { font-size:16px; font-weight:700; }
.empty-output-sub { font-size:12px; color:var(–muted); text-align:center; line-height:1.6; }

/* TYPING */
.typing { display:flex; gap:4px; align-items:center; padding:3px 0; }
.typing span { width:6px; height:6px; border-radius:50%; background:var(–muted); animation:bounce 1.2s ease-in-out infinite; }
.typing span:nth-child(2) { animation-delay:.2s; }
.typing span:nth-child(3) { animation-delay:.4s; }
@keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }

/* ═══════════════════════════════════════
QUOTE DOCUMENT - PROFESSIONAL DESIGN
═══════════════════════════════════════ */
#quoteDoc {
display:none;
border-radius:16px; overflow:hidden;
animation:fadeUp 0.4s ease both;
font-family:‘Tajawal’,sans-serif;
}
#quoteDoc.show { display:block; }
@keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }

/* MAIN GRID - Left hotels, Right info */
.q-grid {
display:grid;
grid-template-columns:1fr 1fr;
min-height:500px;
}

/* ── LEFT: HOTELS ── */
.q-left { background:#fff; display:flex; flex-direction:column; }

.q-left-header {
background:var(–blue1);
color:#fff; font-size:13px; font-weight:800;
padding:12px 16px; text-align:center;
}

.q-hotel-item {
display:grid; grid-template-columns:90px 1fr;
border-bottom:1px solid #eef0f8;
}

.q-hotel-img img {
width:90px; height:95px; object-fit:cover; display:block;
}

.q-hotel-details { padding:8px 10px; }

.q-hotel-name {
font-size:12px; font-weight:800; color:var(–blue1); margin-bottom:2px;
}

.q-hotel-stars { font-size:11px; color:#f6ad55; margin-bottom:3px; }

.q-hotel-tags {
display:flex; flex-wrap:wrap; gap:4px;
}

.q-htag {
font-size:9px; font-weight:700; padding:2px 7px;
border-radius:6px;
}
.q-htag-room { background:#e8f0ff; color:#1a3a8f; }
.q-htag-meal { background:#e8fff0; color:#007733; }
.q-htag-nights { background:#f5e8ff; color:#6600aa; }

/* ── RIGHT: INFO ── */
.q-right {
background:linear-gradient(160deg, #1e4db7 0%, #0d2060 100%);
display:flex; flex-direction:column;
}

/* LOGO BAR */
.q-logo-bar {
background:#fff;
padding:9px 14px;
display:flex; align-items:center; justify-content:space-between;
}
.q-logo-ar { font-size:9px; font-weight:800; color:#cc1111; }
.q-logo-en { font-size:8px; color:#888; }
.q-logo-badge {
background:linear-gradient(135deg,var(–blue1),var(–blue3));
color:#fff; font-size:9px; font-weight:800;
padding:3px 10px; border-radius:12px;
}

/* DESTINATION */
.q-dest-block { padding:18px 18px 10px; }
.q-dest-name {
font-size:42px; font-weight:900; color:#fff; line-height:1;
text-shadow:0 3px 20px rgba(0,0,0,0.5);
}
.q-dest-sub { font-size:11px; color:rgba(255,255,255,0.5); margin-top:3px; }

.q-divider { height:1px; background:rgba(255,255,255,0.12); margin:0 18px; }

/* CLIENT */
.q-client-block { padding:10px 18px; }
.q-block-label {
font-size:9px; color:rgba(255,255,255,0.4);
letter-spacing:2px; text-transform:uppercase; margin-bottom:6px;
}
.q-client-name { font-size:14px; font-weight:800; color:#fff; margin-bottom:5px; }
.q-info-row {
display:flex; align-items:center; gap:6px;
font-size:11px; color:rgba(255,255,255,0.8); margin-bottom:3px;
}
.q-dot { width:4px; height:4px; border-radius:50%; background:#5b9eff; flex-shrink:0; }

/* PRICE */
.q-price-block {
margin:8px 18px;
background:linear-gradient(135deg,#2255cc,#3b6de8);
border-radius:12px; padding:12px 16px;
display:flex; justify-content:space-between; align-items:center;
border:1px solid rgba(255,255,255,0.2);
}
.q-price-num { font-size:34px; font-weight:900; color:#fff; }
.q-price-currency { font-size:11px; color:rgba(255,255,255,0.65); }
.q-price-per { font-size:10px; color:rgba(255,255,255,0.65); text-align:center; line-height:1.5; }

/* FEATURES */
.q-features { padding:6px 18px 14px; display:flex; flex-direction:column; gap:6px; flex:1; }
.q-feat-row {
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.1);
border-radius:8px; padding:7px 12px;
display:flex; align-items:center; justify-content:space-between;
}
.q-feat-text { font-size:11px; font-weight:700; color:#fff; }
.q-feat-icon {
width:26px; height:26px; border-radius:50%;
background:rgba(255,255,255,0.12);
display:flex; align-items:center; justify-content:center; font-size:13px;
}

/* FOOTER */
.q-footer {
background:#cc1111;
padding:10px 18px; text-align:center;
font-size:11px; font-weight:700; color:#fff;
grid-column:1 / -1;
}

/* PROGRAM SECTION - Below grid */
.q-program-section {
background:#f7f9ff;
padding:16px 20px;
border-top:3px solid var(–blue1);
}

.q-section-title {
font-size:11px; font-weight:800; color:var(–blue1);
letter-spacing:2px; text-transform:uppercase;
margin-bottom:10px;
display:flex; align-items:center; gap:8px;
}
.q-section-title::after {
content:’’; flex:1; height:1px;
background:linear-gradient(90deg,rgba(26,58,143,0.3),transparent);
}

.q-day-row {
background:#fff; border:1px solid #e0e8ff;
border-radius:8px; padding:10px 14px; margin-bottom:6px;
}
.q-day-title { font-size:12px; font-weight:800; color:var(–blue1); margin-bottom:5px; }
.q-day-act {
display:flex; align-items:center; gap:7px;
font-size:11px; color:#555; margin-bottom:3px;
}
.q-act-dot { width:4px; height:4px; border-radius:50%; background:var(–blue3); flex-shrink:0; }
.q-act-badge {
font-size:9px; font-weight:700; padding:1px 7px; border-radius:6px; margin-right:auto;
}
.type-tour { background:rgba(212,168,67,0.15); color:#b07800; }
.type-transfer { background:rgba(42,157,143,0.15); color:#006655; }
.type-nature { background:rgba(99,202,115,0.15); color:#1a7a30; }
.type-sea { background:rgba(96,165,250,0.15); color:#0055aa; }

/* COSTS */
.q-costs-section {
background:#fff; padding:16px 20px;
border-top:1px solid #e0e8ff;
}
.q-cost-row {
display:flex; justify-content:space-between; align-items:center;
padding:6px 0; border-bottom:1px solid #eef0f8;
font-size:11px;
}
.q-cost-row:last-child { border-bottom:none; }
.q-cost-label { color:#666; }
.q-cost-val { font-weight:700; color:var(–blue1); }
.q-total-row {
display:flex; justify-content:space-between; align-items:center;
background:linear-gradient(135deg,var(–blue1),var(–blue3));
border-radius:10px; padding:12px 16px; margin-top:10px;
}
.q-total-label { font-size:13px; font-weight:800; color:#fff; }
.q-total-val { font-size:22px; font-weight:900; color:#fff; }
.q-group-row {
display:flex; justify-content:space-between; align-items:center;
padding:8px 0; margin-top:6px;
font-size:12px;
}
.q-group-label { color:var(–blue1); font-weight:700; }
.q-group-val { font-weight:800; color:var(–blue3); }

/* ═══ PRINT STYLES ═══ */
@media print {
body { background:#fff !important; }
.chat-panel, .topbar, .output-header { display:none !important; }
.output-panel { display:block !important; }
.quote-wrap { padding:0 !important; overflow:visible !important; }
.output-panel { overflow:visible !important; }
#quoteDoc { border-radius:0 !important; }
.q-grid { break-inside:avoid; }
<div class="quick-chips" id="quickChips">
<button class="qchip" onclick="quickSend('اسطنبول 4 ليالي مايو زوجين فندق 4 نجوم')">🇹🇷 اسطنبول سريع</button>

</div>

<div class="chat-input-wrap">
<textarea class="chat-input" id="chatInput" placeholder="اكتب تفاصيل العميل هنا..." rows="1"
onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
<button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
</div>
</div>

<!-- OUTPUT PANEL -->

<div class="output-panel">
<div class="output-header">
<div class="output-header-title">📄 عميلة العميل</div>
<div class="export-btns">
<button class="ebtn ebtn-copy" onclick="copyQuote()" id="copyBtn" style="display:none">📋 نسخ</button>
<button class="ebtn ebtn-pdf-nologo" onclick="exportPDF(false)" id="pdfNoLogoBtn" style="display:none">📄 PDF بدون شعار</button>
<button class="ebtn ebtn-pdf" onclick="exportPDF(true)" id="pdfBtn" style="display:none">⬇️ PDF مع شعار</button>
</div>
</div>

<div class="quote-wrap">
<div class="empty-output" id="emptyOutput">
<div class="empty-output-icon">📋</div>
<div class="empty-output-title">العميلة ستظهر هنا</div>
<div class="empty-output-sub">ابدأ محادثة مع المساعد<br>وستُنشأ العميلة تلقائياً وجاهزة للتصدير</div>
</div>

<div id="quoteDoc">
<!-- Filled dynamically -->
</div>
</div>
</div>

</div>

<script>
const history = [];
let isLoading = false;
let lastRawText = '';
let currentQuoteData = null;
HOTEL:[اسم الفندق] | [النجوم] نجوم | [السعر/ليلة] ريال/ليلة | [نوع الغرفة] | [ما يشمل]
TAG:[وسم1],[وسم2],[وسم3]
PRICE:[السعر الإجمالي للشخص] ريال

PROGRAM:
اليوم 1 | [عنوان اليوم]
- [النشاط] | [السعر] ريال | [النوع: ثقافية/طبيعية/بحرية/انتقال/إقامة]

اليوم 2 | [عنوان]
- ...

COSTS:
[البند] | [المبلغ] ريال
TOTAL:[الإجمالي للشخص] ريال
TOTAL_GROUP:[الإجمالي للمجموعة] ريال لـ [عدد الأشخاص] أشخاص

CHAT:[ردك المختصر الودي للموظف باللهجة السعودية، جملة أو جملتين فقط]`;

// SEND MESSAGE
async function sendMessage() {
const input = document.getElementById('chatInput');
const text = input.value.trim();
if (!text || isLoading) return;

addMessage('user', text);
input.value = '';
input.style.height = 'auto';
history.push({ role: 'user', content: text });
document.getElementById('quickChips').style.display = 'none';

isLoading = true;
document.getElementById('sendBtn').disabled = true;
const typingId = addTyping();

try {
const res = await fetch('https://ofotvacszlmrqxzfjmtn.supabase.co/functions/v1/Tourism-AI', {
method: 'POST',
headers: {
'Content-Type': 'application/json',
'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9mb3R2YWNzemxtcnF4emZqbXRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2MjI5NTYsImV4cCI6MjA5MzE5ODk1Nn0.1nQmxW63BFZSK-cn4fzh8tYM7a2JO10AQ0RGQ5bcdYo',
'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9mb3R2YWNzemxtcnF4emZqbXRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2MjI5NTYsImV4cCI6MjA5MzE5ODk1Nn0.1nQmxW63BFZSK-cn4fzh8tYM7a2JO10AQ0RGQ5bcdYo'
},
body: JSON.stringify({
model: 'claude-sonnet-4-5',
max_tokens: 4000,
system: SYSTEM,
messages: history
})
});

const data = await res.json();
const raw = data.content?.[0]?.text || '';
lastRawText = raw;
removeTyping(typingId);
history.push({ role: 'assistant', content: raw });

const chatMatch = raw.match(/CHAT:(.+)/s);
const chatMsg = chatMatch ? chatMatch[1].trim() : 'تم بناء البرنامج!';
addMessage('sys', chatMsg);

if (raw.includes('PROGRAM:')) buildQuote(raw);

} catch (e) {
removeTyping(typingId);
addMessage('sys', 'حدث خطأ في الاتصال، حاول مرة ثانية.');
}

isLoading = false;
document.getElementById('sendBtn').disabled = false;
}

function quickSend(text) {
document.getElementById('chatInput').value = text;
sendMessage();
}

// BUILD QUOTE
function buildQuote(raw) {
const get = (key) => {
const m = raw.match(new RegExp(key + ':(.+)'));
return m ? m[1].trim() : '';
};

const dest = get('DEST');
const meta = get('META');
const hotel = get('HOTEL');
const price = get('PRICE');
const hotelParts = hotel.split('|').map(p => p.trim());
const hotelName = hotelParts[0] || '';
const hotelStars = hotelParts[1] || '';
const hotelPrice = hotelParts[2] || '';
const hotelRoom = hotelParts[3] || '';
const hotelMeal = hotelParts[4] || 'إفطار مشمول';

const metaParts = meta.split('|').map(p => p.trim());
const nights = metaParts[0] || '';
const month = metaParts[1] || '';
const persons = metaParts[2] || '';

const programMatch = raw.match(/PROGRAM:([\s\S]+?)(?:COSTS:|$)/);
const programText = programMatch ? programMatch[1].trim() : '';

const costsMatch = raw.match(/COSTS:([\s\S]+?)(?:CHAT:|$)/);
const costsText = costsMatch ? costsMatch[1].trim() : '';
const totalGroupMatch = costsText.match(/TOTAL_GROUP:(.+)/);

// Stars display
const starsNum = parseInt(hotelStars) || 4;
const starsStr = '★'.repeat(starsNum);

// Build days
const days = programText.split(/\n(?=اليوم)/g).filter(d => d.trim());
let daysHTML = '';
days.forEach(day => {
const lines = day.trim().split('\n');
const titleLine = lines[0];
const dayTitle = titleLine.replace(/^اليوم \d+ \|?\s*/, '').trim();
const dayNum = titleLine.match(/اليوم (\d+)/)?.[1] || '';
const acts = lines.slice(1).filter(l => l.trim().startsWith('-'));

daysHTML += `<div class="q-day-row">
<div class="q-day-title">اليوم ${dayNum} — ${dayTitle}</div>`;

acts.forEach(act => {
const parts = act.replace(/^-\s*/, '').split('|');
const actName = parts[0]?.trim() || '';
const actPrice = parts[1]?.trim() || '';
const actType = parts[2]?.trim() || '';
const typeClass = actType.includes('ثقافية') ? 'type-tour'
: actType.includes('طبيعية') ? 'type-nature'
: actType.includes('بحرية') ? 'type-sea'
: 'type-transfer';
daysHTML += `<div class="q-day-act">
<span class="q-act-dot"></span>
${actName} — ${actPrice}
<span class="q-act-badge ${typeClass}">${actType}</span>
</div>`;
});
daysHTML += `</div>`;
});

// Build costs
let costsHTML = '';
const costLines = costsText.split('\n').filter(l => l.includes('|') && !l.startsWith('TOTAL'));
costLines.forEach(line => {
const [label, val] = line.split('|');
if (label && val) {
costsHTML += `<div class="q-cost-row">
<span class="q-cost-label">${label.replace(/^-\s*/,'').trim()}</span>
<span class="q-cost-val">${val.trim()}</span>
</div>`;
}
});

// Features
const features = [
{ icon: '🍳', text: hotelMeal },
{ icon: '🗺️', text: 'جولات سياحية مميزة' },
{ icon: '🚗', text: 'انتقالات ذهاب وعودة' },
{ icon: '🏨', text: `إقامة ${hotelStars}` },
];

const featHTML = features.map(f => `
<div class="q-feat-row">
<div class="q-feat-text">${f.text}</div>
<div class="q-feat-icon">${f.icon}</div>
</div>`).join('');

// IMAGES for hotels
const hotelImages = [
'https://images.unsplash.com/photo-1566073771259-6a8506099945?w=120&h=95&fit=crop',
'https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?w=120&h=95&fit=crop',
'https://images.unsplash.com/photo-1520250497591-112f2f40a3f4?w=120&h=95&fit=crop',
];

const html = `
<div class="q-grid">

<!-- LEFT: HOTELS -->
<div class="q-left">
<div class="q-left-header">🏨 فنادق الرحلة - ترتيب السكن</div>
<div class="q-hotel-item">
<div class="q-hotel-img"><img src="${hotelImages[0]}" alt="فندق" onerror="this.style.display='none'"></div>
<div class="q-hotel-details">
<div class="q-hotel-name">${hotelName}</div>
<div class="q-hotel-stars">${starsStr} ${hotelStars}</div>
<div class="q-hotel-tags">
<span class="q-htag q-htag-room">🛏️ ${hotelRoom}</span>
<span class="q-htag q-htag-meal">🍳 ${hotelMeal}</span>
<span class="q-htag q-htag-nights">📅 ${nights}</span>
</div>
</div>
</div>
</div>

<!-- RIGHT: INFO -->
<div class="q-right">

<div class="q-logo-bar" id="qLogoBar">
<div>
<div class="q-logo-ar">مجموعة العز الدولية للسفر والسياحة</div>
<div class="q-logo-en">Alezz International Group Travel & Tours</div>
</div>
<div class="q-logo-badge">A.I. ✈ T.T</div>
</div>

<div class="q-dest-block">
<div class="q-dest-name">${dest}</div>
<div class="q-dest-sub">برنامج سياحي متكامل</div>
</div>

<div class="q-divider"></div>

<div class="q-client-block">
<div class="q-block-label">تفاصيل الرحلة والعميل</div>
<div class="q-info-row"><span class="q-dot"></span> عدد الأشخاص: ${persons}</div>
<div class="q-info-row"><span class="q-dot"></span> ${nights} | ${month}</div>
</div>

<div class="q-price-block">
<div>
<div class="q-price-num">${price.replace(' ريال','')}</div>
<div class="q-price-currency">ريال سعودي</div>
</div>
<div class="q-price-per">للفرد<br>الواحد</div>
</div>

<div class="q-features">${featHTML}</div>

</div>

<!-- FOOTER -->
<div class="q-footer">شامل الانتقالات ذهاب وعودة • مجموعة العز الدولية للسفر والسياحة</div>

</div>

<!-- PROGRAM -->
<div class="q-program-section">
<div class="q-section-title">🗓️ البرنامج اليومي</div>
${daysHTML}
</div>

<!-- COSTS -->
<div class="q-costs-section">
<div class="q-section-title">💰 التكاليف</div>
${costsHTML}

const dest = currentQuoteData?.dest || '';

const body = document.getElementById('quoteDoc').innerText;
navigator.clipboard.writeText(body).then(() => {
const btn = document.getElementById('copyBtn');
btn.textContent = '✅ تم النسخ';
setTimeout(() => btn.textContent = '📋 نسخ', 2000);
});
}
